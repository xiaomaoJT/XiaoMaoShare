<script>
(function () {
  'use strict';

  /* ============================================================ 小工具 */
  var $ = function (id) { return document.getElementById(id); };
  var feed = $('feed'), sendBtn = $('send'), fileInput = $('file');
  var pickBtn = $('pick'), countEl = $('count'), peerRow = $('peerRow'), peerCountEl = $('peerCount');
  var clearBtn = $('clear'), hintEl = $('hint'), lockedEl = $('locked');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  /* ============================================================ Markdown */
  /** 只放行 http(s) / mailto，避免 javascript: 之类的链接 */
  function safeUrl(u) {
    var s = String(u || '').trim();
    if (!/^(https?:\/\/|mailto:)/i.test(s)) return '#';
    return s.replace(/</g, '%3C').replace(/>/g, '%3E').replace(/"/g, '%22').replace(/'/g, '%27');
  }

  /** 行内语法：代码、链接、粗体、斜体、删除线 */
  function mdInline(raw) {
    var slots = [];
    var s = esc(raw);
    // 行内代码先占位，免得里面的 * _ 被当成强调
    s = s.replace(/`([^`\n]+)`/g, function (m, c) {
      slots.push('<code>' + c + '</code>');
      return '\u0001' + (slots.length - 1) + '\u0001';
    });
    // 图片语法退化成链接（不加载第三方资源）
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, url) {
      return '<a href="' + safeUrl(url) + '" target="_blank" rel="noopener">' + (alt || url) + '</a>';
    });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, url) {
      return '<a href="' + safeUrl(url) + '" target="_blank" rel="noopener">' + t + '</a>';
    });
    s = s.replace(/(^|[\s(（])(https?:\/\/[^\s<]+)/g, function (m, pre, url) {
      var t = url.replace(/[.,;:!?)]+$/, '');
      return pre + '<a href="' + safeUrl(t) + '" target="_blank" rel="noopener">' + t + '</a>' + url.slice(t.length);
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^\w])__([^_]+)__(?![\w])/g, '$1<strong>$2</strong>');
    s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
    s = s.replace(/(^|[^\w_])_([^_\n]+)_(?![\w])/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    return s.replace(/\u0001(\d+)\u0001/g, function (m, i) { return slots[+i]; });
  }

  function mdCells(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
  }

  function mdCode(code, lang) {
    var l = String(lang || '').toLowerCase().slice(0, 16);
    return '<div class="code">' +
      '<div class="code-hd"><span class="code-lang">' + (l ? esc(l) : '代码') + '</span>' +
      '<button type="button" class="code-copy">复制</button></div>' +
      '<pre><code>' + esc(code) + '</code></pre></div>';
  }

  function mdListItem(t) {
    var m = /^\[([ xX])\]\s+([\s\S]*)$/.exec(t);
    if (m) return '<li><span class="task">' + (m[1] === ' ' ? '☐' : '☑') + '</span>' + mdInline(m[2]) + '</li>';
    return '<li>' + mdInline(t) + '</li>';
  }

  var MD_HR = /^ {0,3}([-*_])[ \t]*\1[ \t]*\1[-*_ \t]*$/;
  var MD_FENCE = /^ {0,3}(`{3,}|~{3,})[ \t]*([^\s`]*)[ \t]*$/;
  var MD_HEAD = /^ {0,3}(#{1,6})[ \t]+(.*?)[ \t]*#*[ \t]*$/;
  var MD_QUOTE = /^ {0,3}>/;
  var MD_ITEM = /^ {0,3}([-*+]|\d{1,9}[.)])[ \t]+(.*)$/;

  /** 把一段 Markdown 变成 HTML（先转义，再套标签，不会执行任何脚本） */
  function mdToHtml(src) {
    var lines = String(src == null ? '' : src).replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0, n = lines.length;

    while (i < n) {
      var line = lines[i];

      if (!line.trim()) { i++; continue; }

      // 围栏代码块
      var fm = MD_FENCE.exec(line);
      if (fm) {
        var mark = fm[1][0], need = fm[1].length, buf = [];
        i++;
        while (i < n) {
          var close = lines[i].match(/^ {0,3}(`{3,}|~{3,})[ \t]*$/);
          if (close && close[1][0] === mark && close[1].length >= need) { i++; break; }
          buf.push(lines[i]);
          i++;
        }
        out.push(mdCode(buf.join('\n'), fm[2]));
        continue;
      }

      // 分隔线
      if (MD_HR.test(line)) { out.push('<hr>'); i++; continue; }

      // 标题
      var hm = MD_HEAD.exec(line);
      if (hm) {
        var lv = hm[1].length;
        out.push('<h' + lv + '>' + mdInline(hm[2]) + '</h' + lv + '>');
        i++;
        continue;
      }

      // 引用（可跨行）
      if (MD_QUOTE.test(line)) {
        var q = [];
        while (i < n && lines[i].trim()) {
          q.push(lines[i].replace(/^ {0,3}>[ \t]?/, ''));
          i++;
        }
        out.push('<blockquote>' + mdToHtml(q.join('\n')) + '</blockquote>');
        continue;
      }

      // 表格
      if (line.indexOf('|') > -1 && i + 1 < n) {
        var sep = mdCells(lines[i + 1]);
        var isTable = sep.length && sep.every(function (c) { return /^:?-{2,}:?$/.test(c); });
        if (isTable) {
          var head = mdCells(line), rows = [];
          i += 2;
          while (i < n && lines[i].indexOf('|') > -1 && lines[i].trim()) { rows.push(mdCells(lines[i])); i++; }
          var html = '<table><thead><tr>' +
            head.map(function (c) { return '<th>' + mdInline(c) + '</th>'; }).join('') +
            '</tr></thead><tbody>' +
            rows.map(function (r) {
              return '<tr>' + head.map(function (_, k) {
                return '<td>' + mdInline(r[k] == null ? '' : r[k]) + '</td>';
              }).join('') + '</tr>';
            }).join('') + '</tbody></table>';
          out.push(html);
          continue;
        }
      }

      // 列表
      if (MD_ITEM.test(line)) {
        var ordered = /\d/.test(MD_ITEM.exec(line)[1]);
        var items = [];
        while (i < n) {
          var im = MD_ITEM.exec(lines[i]);
          if (!im) break;
          items.push(im[2]);
          i++;
        }
        var tag = ordered ? 'ol' : 'ul';
        out.push('<' + tag + '>' + items.map(mdListItem).join('') + '</' + tag + '>');
        continue;
      }

      // 段落（连续非空行，行内换行保留）
      var para = [];
      while (i < n && lines[i].trim() &&
        !MD_FENCE.test(lines[i]) && !MD_HEAD.test(lines[i]) && !MD_HR.test(lines[i]) &&
        !MD_QUOTE.test(lines[i]) && !MD_ITEM.test(lines[i])) {
        para.push(lines[i]);
        i++;
      }
      if (!para.length) { i++; continue; }
      out.push('<p>' + para.map(function (l) { return mdInline(l.replace(/\s+$/, '')); }).join('<br>') + '</p>');
    }

    return '<div class="md">' + out.join('') + '</div>';
  }
  function fmtSize(n) {
    if (n == null) return '';
    if (n < 1024) return n + ' B';
    var u = ['KB', 'MB', 'GB', 'TB'], i = -1, v = n;
    do { v /= 1024; i++; } while (v >= 1024 && i < u.length - 1);
    return (v < 10 ? v.toFixed(1) : Math.round(v)) + ' ' + u[i];
  }
  function fmtTime(t) {
    var d = new Date(t), diff = (Date.now() - t) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    var p = function (x) { return x < 10 ? '0' + x : x; };
    if (new Date().toDateString() === d.toDateString()) return p(d.getHours()) + ':' + p(d.getMinutes());
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function colorOf(seed) {
    var palette = ['#4c6ef5', '#8b5cf6', '#0ea5e9', '#10b981', '#f59e0b', '#ef4444', '#ec4899', '#14b8a6'];
    var h = 0, s = String(seed || '?');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return palette[h % palette.length];
  }
  function svgIcon(path, sw) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 2) +
      '" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>';
  }
  var ICOPY = svgIcon('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>');
  var IDEL = svgIcon('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>');
  var IDL = svgIcon('<path d="M12 3v12m0 0l4-4m-4 4l-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>');
  var ILOCK = svgIcon('<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>', 2);
  var IGEAR = svgIcon('<circle cx="12" cy="12" r="3.2"/><path d="M19.2 14.6a1.5 1.5 0 0 0 .3 1.7l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.5 1.5 0 0 0-1.7-.3 1.5 1.5 0 0 0-.9 1.4v.2a2 2 0 1 1-4 0v-.1a1.5 1.5 0 0 0-1-1.4 1.5 1.5 0 0 0-1.7.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.5 1.5 0 0 0 .3-1.7 1.5 1.5 0 0 0-1.4-.9H3a2 2 0 1 1 0-4h.1a1.5 1.5 0 0 0 1.4-1 1.5 1.5 0 0 0-.3-1.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.5 1.5 0 0 0 1.7.3H9a1.5 1.5 0 0 0 .9-1.4V3a2 2 0 1 1 4 0v.1a1.5 1.5 0 0 0 .9 1.4 1.5 1.5 0 0 0 1.7-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.5 1.5 0 0 0-.3 1.7V9a1.5 1.5 0 0 0 1.4.9H21a2 2 0 1 1 0 4h-.1a1.5 1.5 0 0 0-1.4.9z"/>', 1.7);
  var ICONTRAST = svgIcon('<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" stroke="none"/>', 1.8);
  var IQR = svgIcon('<rect x="3.2" y="3.2" width="6.6" height="6.6" rx="1.3"/><rect x="14.2" y="3.2" width="6.6" height="6.6" rx="1.3"/><rect x="3.2" y="14.2" width="6.6" height="6.6" rx="1.3"/><path d="M14.2 14.2h2.6v2.6h-2.6zM18.2 18.2h2.6v2.6h-2.6zM14.2 20.8h1.2M20.8 14.2v1.2"/>', 1.9);
  var ICHECK = svgIcon('<path d="M20 6L9 17l-5-5"/>', 2.6);

  function toast(msg) {
    var box = $('toasts');
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(function () {
      el.style.transition = 'opacity .25s'; el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 260);
    }, 1900);
  }

  /* ============================================================ 主题 */
  var THEMES = [
    { key: 'light', label: '浅色', cls: 'sw-light', meta: '#f2f4f7' },
    { key: 'dark', label: '暗色', cls: 'sw-dark', meta: '#0d1015' },
    { key: 'glass', label: '毛玻璃', cls: 'sw-glass', meta: '#e9eefa' }
  ];

  function currentTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    for (var i = 0; i < THEMES.length; i++) if (THEMES[i].key === t) return t;
    return 'light';
  }
  function applyTheme(key, persist) {
    var meta = THEMES[0];
    for (var i = 0; i < THEMES.length; i++) if (THEMES[i].key === key) meta = THEMES[i];
    document.documentElement.setAttribute('data-theme', meta.key);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', meta.meta);
    if (persist !== false) localStorage.setItem('xm.theme', meta.key);
    $('themeBtn').innerHTML = ICONTRAST;
  }
  (function initTheme() {
    var saved = localStorage.getItem('xm.theme');
    var valid = THEMES.some(function (t) { return t.key === saved; });
    if (valid) applyTheme(saved, false);
    else {
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(dark ? 'dark' : 'light', false);
    }
  })();

  /* ============================================================ 弹窗组件 */
  var Dialog = (function () {
    function build(opt) {
      return new Promise(function (resolve) {
        var mask = document.createElement('div');
        mask.className = 'dlg-mask';
        var card = document.createElement('div');
        card.className = 'dlg';
        card.setAttribute('role', 'dialog');
        card.setAttribute('aria-modal', 'true');

        if (opt.title) {
          var h = document.createElement('h3');
          h.textContent = opt.title;
          card.appendChild(h);
        }
        if (opt.desc) {
          var p = document.createElement('p');
          p.textContent = opt.desc;
          card.appendChild(p);
        }
        if (opt.body) card.appendChild(opt.body);

        var bar = document.createElement('div');
        bar.className = 'dlg-acts';
        var actionEls = [];
        (opt.actions || [{ label: '知道了', value: true, kind: 'primary' }]).forEach(function (a) {
          var b = document.createElement('button');
          b.className = 'btn ' + (a.kind === 'primary' ? 'primary' : a.kind === 'danger' ? 'danger' : 'ghost');
          b.textContent = a.label;
          b.onclick = function () { finish(a.value); };
          bar.appendChild(b);
          actionEls.push(b);
        });
        card.appendChild(bar);
        mask.appendChild(card);
        document.body.appendChild(mask);

        var closed = false;
        function finish(val) {
          if (closed) return;
          closed = true;
          mask.classList.add('out');
          setTimeout(function () { mask.remove(); }, 170);
          document.removeEventListener('keydown', onKey);
          resolve(val);
        }
        function onKey(e) {
          if (e.key === 'Escape') { e.preventDefault(); finish(null); return; }
          if (e.key === 'Enter' && e.target && e.target.tagName !== 'TEXTAREA') {
            var primary = bar.querySelector('.primary, .danger');
            if (primary) { e.preventDefault(); primary.click(); }
          }
        }
        document.addEventListener('keydown', onKey);
        mask.addEventListener('mousedown', function (e) { if (e.target === mask) finish(null); });

        var focusEl = card.querySelector('input[type=text]') || actionEls[actionEls.length - 1];
        if (focusEl) setTimeout(function () { try { focusEl.focus(); if (focusEl.select) focusEl.select(); } catch (err) {} }, 40);
        if (opt.onReady) opt.onReady({ close: finish });
      });
    }

    return {
      open: build,
      confirm: function (o) {
        return build({
          title: o.title, desc: o.desc,
          actions: [
            { label: o.cancel || '取消', value: false },
            { label: o.ok || '确定', value: true, kind: o.danger ? 'danger' : 'primary' }
          ]
        }).then(function (v) { return v === true; });
      },
      prompt: function (o) {
        var wrapEl = document.createElement('div');
        var inp = document.createElement('input');
        inp.type = 'text';
        inp.value = o.value || '';
        inp.placeholder = o.placeholder || '';
        inp.maxLength = 24;
        wrapEl.appendChild(inp);
        return build({
          title: o.title, desc: o.desc, body: wrapEl,
          actions: [
            { label: '取消', value: null },
            { label: o.ok || '保存', value: 'ok', kind: 'primary' }
          ]
        }).then(function (v) { return v === 'ok' ? inp.value.trim() : null; });
      }
    };
  })();

  /* ============================================================ 状态 */
  var state = {
    cid: localStorage.getItem('xm.cid') || '',
    me: null,
    settings: { allowSend: true, allowText: true, allowImage: true, allowFile: true },
    peers: [],
    admin: false,
    pending: 0,
    toCid: '',
    toName: ''
  };
  var nodes = new Map();
  var lastSig = '';
  var pollTimer = null;
  var tickTimer = null;

  function api(path, opt) {
    return fetch(path, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        return d;
      });
    });
  }

  /* ============================================================ 接入许可 */
  /**
   * 陌生设备首次访问时挡住整个界面：输入密码 → 等待主设备确认 → 通过 / 被拒。
   * 主设备（本机）永远不会走到这里。
   */
  var Gate = (function () {
    var el = $('gate'), titleEl = $('gateTitle'), descEl = $('gateDesc');
    var bodyEl = $('gateBody'), metaEl = $('gateMeta');
    var timer = null, onPass = null, info = null;

    function stopPoll() {
      if (timer) { clearInterval(timer); timer = null; }
    }
    function setMeta(d) {
      if (d) info = d;
      if (!info) return;
      var bits = [];
      if (info.ip) bits.push('本机 IP <code>' + esc(info.ip) + '</code>');
      if (info.host) bits.push('主设备 <code>' + esc(info.host) + '</code>');
      metaEl.innerHTML = bits.join(' · ');
    }
    function shell(title, desc) {
      titleEl.textContent = title;
      descEl.textContent = desc;
    }

    /* 输入密码 */
    function form(errMsg) {
      stopPoll();
      shell('需要接入许可', '这是同一 Wi-Fi 下的互传服务。输入接入密码后，还要等主设备同意。');
      bodyEl.innerHTML = '';

      var wrap = document.createElement('div');
      wrap.className = 'gate-form';

      var inp = document.createElement('input');
      inp.type = 'password';
      inp.placeholder = '接入密码';
      inp.autocomplete = 'off';
      inp.maxLength = 32;
      inp.setAttribute('aria-label', '接入密码');

      var btn = document.createElement('button');
      btn.className = 'btn primary';
      btn.textContent = '申请接入';

      var err = document.createElement('div');
      err.className = 'gate-err';
      err.textContent = errMsg || '';

      wrap.appendChild(inp);
      wrap.appendChild(btn);
      wrap.appendChild(err);
      bodyEl.appendChild(wrap);
      setTimeout(function () { try { inp.focus(); } catch (e) {} }, 80);

      function submit() {
        var v = inp.value.trim();
        if (!v) { err.textContent = '请先输入接入密码'; inp.focus(); return; }
        btn.disabled = true;
        btn.textContent = '提交中…';
        api('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: v, cid: state.cid, ua: navigator.userAgent })
        }).then(function (d) {
          if (d.authorized) return pass(d);
          waiting();
        }).catch(function (e) {
          btn.disabled = false;
          btn.textContent = '申请接入';
          err.textContent = e.message || '提交失败，请重试';
          inp.select();
        });
      }
      btn.onclick = submit;
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); submit(); }
      });
    }

    /* 等待审批 */
    function waiting() {
      shell('等待主设备确认', '申请已经送达。等主设备在「设置 → 设备授权」里点同意，通过后会自动进入。');
      bodyEl.innerHTML = '<div class="spin"></div>';

      var again = document.createElement('button');
      again.className = 'gate-link';
      again.textContent = '密码填错了？重新输入';
      again.onclick = function () { form(); };
      bodyEl.appendChild(again);

      stopPoll();
      timer = setInterval(function () {
        api('/api/hello', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cid: state.cid, ua: navigator.userAgent })
        }).then(function (d) {
          if (d.authorized) { stopPoll(); pass(d); return; }
          if (d.status === 'rejected') { stopPoll(); rejected(); }
        }).catch(function () {});
      }, 2000);
    }

    /* 被拒 */
    function rejected() {
      stopPoll();
      shell('主设备没有同意', '这台设备暂时用不了。可以再申请一次，或者换一台已获许可的设备。');
      bodyEl.innerHTML = '';
      var wrap = document.createElement('div');
      wrap.className = 'gate-form';
      var btn = document.createElement('button');
      btn.className = 'btn ghost';
      btn.textContent = '重新申请';
      btn.onclick = function () { form(); };
      wrap.appendChild(btn);
      bodyEl.appendChild(wrap);
    }

    function pass(d) {
      stopPoll();
      el.classList.remove('on');
      if (onPass) onPass(d);
    }

    return {
      open: function (status, opt) {
        opt = opt || {};
        if (opt.onPass) onPass = opt.onPass;
        if (opt.info) setMeta(opt.info);
        el.classList.add('on');
        if (status === 'pending') waiting();
        else if (status === 'rejected') rejected();
        else form(opt.message || '');
      },
      close: function () { stopPoll(); el.classList.remove('on'); },
      meta: setMeta
    };
  })();

  /* ============================================================ 在线设备 */
  function renderPeers(peers) {
    peerRow.innerHTML = '';
    peers.forEach(function (p) {
      var el = document.createElement('div');
      el.className = 'peer' + (p.cid === state.cid ? ' me' : '');
      el.title = p.name + (p.ip ? ' · ' + p.ip : '');
      var ava = document.createElement('span');
      ava.className = 'pava';
      ava.style.background = colorOf(p.name);
      ava.textContent = String(p.name || '?').slice(0, 1).toUpperCase();
      var name = document.createElement('span');
      name.className = 'pname';
      name.textContent = p.name;
      el.appendChild(ava);
      el.appendChild(name);
      if (p.admin) {
        var b = document.createElement('span');
        b.className = 'pbadge';
        b.textContent = '主设备';
        el.appendChild(b);
      }
      peerRow.appendChild(el);
    });
    peerCountEl.textContent = peers.length;
  }

  /* ============================================================ 发送对象 */
  function renderToChip() {
    var btn = $('toBtn');
    var priv = !!state.toCid;
    $('toName').textContent = priv ? (state.toName || '指定设备') : '所有人';
    btn.classList.toggle('private', priv);
    btn.title = priv
      ? '私聊：只有你和「' + (state.toName || '对方') + '」能看到，点击可改'
      : '当前所有人可见，点击可改为私聊';
  }

  function openTargetPicker() {
    var listEl = document.createElement('div');
    listEl.className = 'pick-list';
    var current = state.toCid;
    var handle = null;

    var opts = [{ cid: '', name: '所有人', sub: '同一 Wi-Fi 下的设备都能看到' }];
    state.peers.forEach(function (p) {
      if (p.cid === state.cid) return;
      opts.push({ cid: p.cid, name: p.name, sub: p.ip || '' });
    });
    var known = opts.some(function (o) { return o.cid === current; });
    if (current && !known) {
      opts.push({ cid: current, name: state.toName || '已选设备', sub: '当前不在线' });
    }

    opts.forEach(function (o) {
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'pick-row' + (o.cid === current ? ' on' : '');
      row.innerHTML =
        '<span class="pick-ava" style="background:' + (o.cid ? colorOf(o.name) : '#94a3b8') + '">' +
        esc(o.cid ? String(o.name).slice(0, 1).toUpperCase() : '全') + '</span>' +
        '<span class="pick-txt"><span class="pick-name">' + esc(o.name) + '</span>' +
        (o.sub ? '<span class="pick-sub">' + esc(o.sub) + '</span>' : '') + '</span>' +
        (o.cid === current ? '<span class="pick-check">' + ICHECK + '</span>' : '');
      row.onclick = function () {
        state.toCid = o.cid;
        state.toName = o.cid ? o.name : '';
        renderToChip();
        if (handle) handle.close(true);
      };
      listEl.appendChild(row);
    });

    Dialog.open({
      title: '发送给谁',
      desc: '默认全局域网可见；选一台设备就变成私聊，只有你们两台看得到。',
      body: listEl,
      onReady: function (h) { handle = h; },
      actions: [{ label: '取消', value: null }]
    }).then(renderToChip);
  }

  /* ============================================================ 权限 */
  function canSend(kind) {
    if (state.admin) return true;
    var s = state.settings;
    if (!s.allowSend) return false;
    if (kind === 'text') return s.allowText;
    if (kind === 'image') return s.allowImage;
    return s.allowFile;
  }
  function canDelete(it) {
    return state.admin || (it.owner && it.owner === state.cid);
  }

  function applyPermissions() {
    var s = state.settings;
    var textOK = canSend('text');
    var attachOK = canSend('image') || canSend('file');

    compose.forEach(function (b) {
      if (b.type === 'text') b.el.disabled = !textOK;
    });
    pickBtn.disabled = !attachOK;

    var tools = $('mtools');
    if (tools) {
      Array.prototype.forEach.call(tools.querySelectorAll('.tool'), function (t) {
        if (t.dataset.tool !== 'preview') t.disabled = !textOK;
      });
    }

    var msg = '';
    if (!state.admin) {
      if (!s.allowSend) msg = '主设备已关闭其他设备的发送权限，当前只能查看和下载';
      else if (!textOK && !attachOK) msg = '主设备限制了可发送的内容类型';
      else if (!textOK) msg = '当前只能发送图片或文件';
      else if (!attachOK) msg = '当前只能发送文字';
    }
    lockedEl.hidden = !msg;
    lockedEl.innerHTML = msg ? (ILOCK + '<span>' + esc(msg) + '</span>') : '';

    if (msg) hintEl.hidden = true;
    else syncSend();

    var sb = $('settingsBtn');    sb.hidden = !state.admin;
    sb.classList.toggle('admin', state.admin);
    if (!sb.firstChild) sb.innerHTML = IGEAR;
    sb.classList.toggle('dot', state.admin && state.pending > 0);
    sb.title = state.admin && state.pending > 0
      ? ('主设备设置 · ' + state.pending + ' 台设备等待确认')
      : '主设备设置';

    var qb = $('qrBtn');
    qb.hidden = !state.admin;
    if (!qb.firstChild) qb.innerHTML = IQR;

    clearBtn.hidden = !state.admin;
  }

  /* ============================================================ 卡片 */
  function makeCard(it) {
    var el = document.createElement('article');
    el.className = 'card';

    var meta = document.createElement('div');
    meta.className = 'meta';
    var ava = document.createElement('span');
    ava.className = 'ava';
    ava.style.background = colorOf(it.from || '?');
    ava.textContent = String(it.from || '?').slice(0, 1).toUpperCase();
    var who = document.createElement('span');
    who.className = 'who';
    who.textContent = it.from || '匿名设备';
    who.title = it.from || '';
    var time = document.createElement('span');
    time.className = 'when';
    time.textContent = fmtTime(it.time);
    time.dataset.ts = it.time;

    var acts = document.createElement('div');
    acts.className = 'acts';

    var parts = Array.isArray(it.parts) && it.parts.length
      ? it.parts
      : (it.text ? [{ kind: 'text', text: it.text }] : []);
    var texts = parts.filter(function (p) { return p.kind === 'text'; }).map(function (p) { return p.text; });

    if (texts.length) {
      var cbtn = document.createElement('button');
      cbtn.className = 'icon'; cbtn.innerHTML = ICOPY; cbtn.title = '复制文字';
      cbtn.onclick = function () { copyText(texts.join('\n\n')); };
      acts.appendChild(cbtn);
    }
    if (canDelete(it)) {
      var dbtn = document.createElement('button');
      dbtn.className = 'icon del'; dbtn.innerHTML = IDEL; dbtn.title = '删除';
      dbtn.onclick = function () { removeItem(it); };
      acts.appendChild(dbtn);
    }

    meta.appendChild(ava); meta.appendChild(who);
    if (it.to) {
      var pv = document.createElement('span');
      pv.className = 'pv';
      var other = (state.me && it.owner === state.cid) ? (it.toName || '对方') : (it.from || '对方');
      pv.textContent = '私聊';
      pv.title = '只有你和「' + other + '」能看到';
      meta.appendChild(pv);
    }
    meta.appendChild(time); meta.appendChild(acts);
    el.appendChild(meta);

    // 片段按顺序铺开：文字段、图片组、文件行
    var run = [];
    function flushImages() {
      if (!run.length) return;
      var grid = document.createElement('div');
      grid.className = 'shots n' + Math.min(run.length, 3);
      run.forEach(function (p) {
        var img = document.createElement('img');
        img.className = 'thumb';
        img.loading = 'lazy';
        img.src = '/f/' + p.fid;
        img.alt = p.name || '图片';
        img.title = (p.name || '图片') + ' · ' + fmtSize(p.size);
        img.onclick = function () { openLb('/f/' + p.fid); };
        img.onerror = function () {
          img.remove();
          if (!grid.querySelector('img')) {
            grid.className = 'shots n1';
            var note = document.createElement('div');
            note.className = 'img-broken';
            note.textContent = '图片无法显示（文件可能已损坏或不完整）';
            grid.appendChild(note);
          }
        };
        grid.appendChild(img);
      });
      el.appendChild(grid);
      run = [];
    }

    parts.forEach(function (p) {
      if (p.kind === 'text') {
        flushImages();
        var body = document.createElement('div');
        body.className = 'text-body';
        body.innerHTML = mdToHtml(p.text);
        el.appendChild(body);
      } else if (p.kind === 'image') {
        run.push(p);
      } else {
        flushImages();
        el.appendChild(fileRow(p));
      }
    });
    flushImages();

    return el;
  }

  function fileRow(p) {
    var row = document.createElement('div');
    row.className = 'file';
    var nm = String(p.name || '未命名文件');
    var ext = nm.split('.').pop();
    var fico = document.createElement('div');
    fico.className = 'fico';
    fico.textContent = ext && ext !== nm ? ext.slice(0, 4) : 'FILE';
    var info = document.createElement('div');
    info.style.minWidth = '0';
    var fname = document.createElement('div');
    fname.className = 'fname';
    fname.textContent = nm;
    var fsize = document.createElement('div');
    fsize.className = 'fsize';
    fsize.textContent = fmtSize(p.size);
    info.appendChild(fname);
    info.appendChild(fsize);
    var dl = document.createElement('a');
    dl.className = 'dl';
    dl.href = '/f/' + p.fid + '?dl=1';
    dl.setAttribute('download', nm);
    dl.innerHTML = IDL + '<span>下载</span>';
    row.appendChild(fico);
    row.appendChild(info);
    row.appendChild(dl);
    return row;
  }

  /** 长内容默认折叠：超过约 7 行才收起并给「展开全文」 */
  function maybeClamp(el) {
    el.querySelectorAll('.text-body').forEach(function (body) {
      if (body.scrollHeight <= 180) return;
      body.classList.add('clamp');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'more';
      btn.textContent = '展开全文';
      var open = false;
      btn.onclick = function () {
        open = !open;
        body.classList.toggle('clamp', !open);
        btn.textContent = open ? '收起' : '展开全文';
      };
      body.insertAdjacentElement('afterend', btn);
    });
  }

  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(t).then(function () { toast('已复制'); }, function () { legacyCopy(t); });
    } else legacyCopy(t);
  }
  function legacyCopy(t) {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制'); }
    catch (e) { toast('复制失败，请长按选择'); }
    ta.remove();
  }

  async function removeItem(it) {
    var hasFiles = (it.parts || []).some(function (p) { return p.kind !== 'text'; });
    var ok = await Dialog.confirm({
      title: '删除这条内容？',
      desc: hasFiles ? '里面的文件会从本机一并删除，不可恢复。' : '删除后其他设备也看不到了。',
      ok: '删除', danger: true
    });
    if (!ok) return;
    try {
      await api('/api/item?id=' + encodeURIComponent(it.id) + '&cid=' + encodeURIComponent(state.cid), { method: 'DELETE' });
      poll(true);
    } catch (e) { toast(e.message || '删除失败'); }
  }

  function render(items) {
    var seen = new Set();
    var fresh = [];
    var frag = document.createDocumentFragment();
    items.forEach(function (it) {
      var el = nodes.get(it.id);
      if (!el) { el = makeCard(it); nodes.set(it.id, el); fresh.push(el); }
      frag.appendChild(el);
      seen.add(it.id);
    });
    nodes.forEach(function (el, id) {
      if (!seen.has(id)) { el.remove(); nodes.delete(id); }
    });
    feed.appendChild(frag);

    fresh.forEach(maybeClamp);

    feed.querySelectorAll('.meta > span[data-ts]').forEach(function (s) {
      s.textContent = fmtTime(Number(s.dataset.ts));
    });

    countEl.textContent = items.length ? ('共 ' + items.length + ' 条内容') : '还没有内容';
    var empty = feed.querySelector('.empty');
    if (!items.length && !empty) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '<div class="logo"><img src="/logo.gif" alt="XiaoMao"></div>'
        + '<p>把文件、图片拖进来，或直接粘贴截图<br>发送后，同一 Wi-Fi 下的设备都能看到</p>';
      feed.appendChild(e);
    } else if (items.length && empty) {
      empty.remove();
    }
  }

  /* ============================================================ 同步 */
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(function () { poll(false); }, 1500);
    if (!tickTimer) tickTimer = setInterval(tickTimes, 20000);
  }

  function poll(force) {
    var url = '/api/list' + (state.cid ? '?cid=' + encodeURIComponent(state.cid) : '');
    fetch(url, { cache: 'no-store' }).then(function (r) {
      // 授权被主设备移除：立刻退回准入界面
      if (r.status === 401) {
        stopPolling();
        return r.json().catch(function () { return {}; }).then(function (d) {
          var msg = d.status === 'rejected' ? '' : '这台设备的授权已被主设备移除，请重新验证。';
          Gate.open(d.status || 'none', { message: msg, onPass: launch });
          throw new Error('unauthorized');
        });
      }
      return r.json();
    }).then(function (d) {
      applyHello(d);

      var list = d.items || [];
      var sig = list.map(function (x) { return x.id; }).join(',');
      if (!force && sig === lastSig) { tickTimes(); return; }
      lastSig = sig;
      render(list);
    }).catch(function () {});
  }

  function applyHello(d) {
    if (!d) return;
    if (d.me) {
      state.cid = d.me.cid;
      state.me = d.me;
      localStorage.setItem('xm.cid', d.me.cid);
    }
    if (typeof d.admin === 'boolean') state.admin = d.admin;
    if (typeof d.pending === 'number') state.pending = d.pending;
    if (d.settings) state.settings = d.settings;
    if (d.peers) { state.peers = d.peers; renderPeers(d.peers); }
    applyPermissions();
    syncWho();
  }

  function tickTimes() {
    feed.querySelectorAll('.meta > span[data-ts]').forEach(function (s) {
      s.textContent = fmtTime(Number(s.dataset.ts));
    });
  }
  function syncWho() {
    if (!state.me) return;
    $('whoName').textContent = state.me.name || '本机';
    $('who').title = (state.me.name || '') + ' · ' + (state.me.ip || '') + '（点击改名）';
  }

  /* ============================================================ 输入区（块） */
  /**
   * 输入区是一串有序的「块」：文字块和附件块。发出去就是一条消息的 parts，
   * 所以「文字 → 图片 → 文字」这种图文混排天然成立。
   */
  var blocksEl = $('blocks');
  var compose = [];      // { type:'text', el } | { type:'media', el, file, fid, ... }
  var lastText = null;   // 最近获得焦点的文字块，工具条往这里插

  function autoGrowEl(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, window.innerHeight * 0.4) + 'px';
  }

  function newTextBlock() {
    var ta = document.createElement('textarea');
    ta.className = 'blk-tx';
    ta.rows = 1;
    var b = { type: 'text', el: ta };

    ta.addEventListener('input', function () { autoGrowEl(ta); syncSend(); });
    ta.addEventListener('focus', function () { lastText = b; });
    ta.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); sendAll(); return; }

      var atStart = ta.selectionStart === 0 && ta.selectionEnd === 0;
      if (!atStart) return;
      var i = compose.indexOf(b);

      // 段首退格：删掉前一个附件，或把这一段并回前一段
      if (e.key === 'Backspace' && i > 0) {
        e.preventDefault();
        var prev = compose[i - 1];
        if (prev.type === 'media') removeBlock(prev, true);
        else mergeIntoPrev(b, prev, true);
        return;
      }

      // 上箭头：跳到上一个文字块末尾，整个输入区读起来像一块
      if (e.key === 'ArrowUp') {
        for (var k = i - 1; k >= 0; k--) {
          if (compose[k].type === 'text') {
            e.preventDefault();
            compose[k].el.focus();
            var len = compose[k].el.value.length;
            compose[k].el.selectionStart = compose[k].el.selectionEnd = len;
            return;
          }
        }
      }
    });

    autoGrowEl(ta);
    return b;
  }

  /** 把一段并回前一段，光标留在接缝处 */
  function mergeIntoPrev(b, prev, keepFocus) {
    var head = prev.el.value, tail = b.el.value;
    var gap = head && tail ? '\n' : '';
    prev.el.value = head + gap + tail;
    var caret = head.length + gap.length;

    var i = compose.indexOf(b);
    if (i > -1) compose.splice(i, 1);
    if (b.el.parentNode) b.el.parentNode.removeChild(b.el);

    autoGrowEl(prev.el);
    if (keepFocus) {
      prev.el.focus();
      prev.el.selectionStart = prev.el.selectionEnd = caret;
    }
    refreshPlaceholders();
    syncSend();
    if (previewOn) renderPreview();
  }

  function addTextBlock(focus) {
    var b = newTextBlock();
    compose.push(b);
    blocksEl.appendChild(b.el);
    autoGrowEl(b.el);
    refreshPlaceholders();
    if (focus) b.el.focus();
    return b;
  }

  function refreshPlaceholders() {
    var first = true;
    compose.forEach(function (b) {
      if (b.type !== 'text') return;
      b.el.placeholder = first ? '输入文字，支持 Markdown 与下方快捷插入' : '';
      first = false;
    });
  }

  /** 底层移除：不整理、不刷新（供整理逻辑内部用） */
  function dropBlock(b) {
    var i = compose.indexOf(b);
    if (i < 0) return;
    if (b.preview) { try { URL.revokeObjectURL(b.preview); } catch (e) {} }
    compose.splice(i, 1);
    if (b.el && b.el.parentNode) b.el.parentNode.removeChild(b.el);
  }

  /** 收拾多余的空文字块：只留一个落点，删附件后不留空白 */
  function normalizeCompose() {
    var active = document.activeElement;
    var texts = compose.filter(function (b) { return b.type === 'text'; });
    if (!texts.length) { addTextBlock(false); return; }

    var keep = null;
    texts.forEach(function (b) {
      if (!b.el.value.trim() && (!keep || b.el === active)) keep = b;
    });
    if (!keep) return;
    compose.slice().forEach(function (b) {
      if (b !== keep && b.type === 'text' && !b.el.value.trim()) dropBlock(b);
    });
  }

  function removeBlock(b, keepFocus) {
    if (compose.indexOf(b) < 0) return;
    dropBlock(b);
    if (!compose.some(function (x) { return x.type === 'text'; })) addTextBlock(false);
    normalizeCompose();
    refreshPlaceholders();
    syncSend();
    if (previewOn) renderPreview();

    // 键盘触发的删除：光标交回最近的文字块，链路不断
    if (keepFocus) {
      for (var i = 0; i < compose.length; i++) {
        if (compose[i].type === 'text') {
          var ta = compose[i].el;
          ta.focus();
          var len = ta.value.length;
          ta.selectionStart = ta.selectionEnd = len;
          break;
        }
      }
    }
  }

  function buildMediaBlock(b) {
    var row = document.createElement('div');
    row.className = 'blk-md';

    var face;
    if (b.kind === 'image' && b.preview) {
      face = document.createElement('img');
      face.className = 'blk-thumb';
      face.src = b.preview;
      face.alt = b.name;
    } else {
      face = document.createElement('div');
      face.className = 'blk-ico';
      var ext = String(b.name).split('.').pop();
      face.textContent = ext && ext !== b.name ? ext.slice(0, 4) : 'FILE';
    }

    var info = document.createElement('div');
    info.className = 'blk-info';
    var nm = document.createElement('div');
    nm.className = 'blk-nm';
    nm.textContent = b.name;
    nm.title = b.name;
    var sz = document.createElement('div');
    sz.className = 'blk-sz';
    sz.textContent = fmtSize(b.size);
    var bar = document.createElement('div');
    bar.className = 'blk-pg';
    bar.hidden = true;
    var fill = document.createElement('i');
    bar.appendChild(fill);
    info.appendChild(nm);
    info.appendChild(sz);
    info.appendChild(bar);

    var x = document.createElement('button');
    x.type = 'button';
    x.className = 'blk-x';
    x.textContent = '✕';
    x.title = '移除这个附件';
    x.onclick = function () { removeBlock(b); };

    row.appendChild(face);
    row.appendChild(info);
    row.appendChild(x);
    b.refs = { row: row, sz: sz, bar: bar, fill: fill };
    return row;
  }

  function startUpload(b) {
    b.done = new Promise(function (resolve) {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload?name=' + encodeURIComponent(b.name) +
        '&type=' + encodeURIComponent((b.file && b.file.type) || '') +
        '&cid=' + encodeURIComponent(state.cid));

      b.refs.bar.hidden = false;
      b.refs.sz.textContent = '0% · ' + fmtSize(b.size);

      xhr.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        b.refs.fill.style.width = Math.round((e.loaded / e.total) * 100) + '%';
        b.refs.sz.textContent = Math.round((e.loaded / e.total) * 100) + '% · ' + fmtSize(e.total);
      };

      function fail(msg) {
        b.error = msg;
        b.refs.row.classList.add('bad');
        b.refs.bar.hidden = true;
        b.refs.sz.textContent = msg;
        syncSend();
        resolve(b);
      }

      xhr.onload = function () {
        var d = {};
        try { d = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status === 200 && d.part) {
          b.fid = d.part.fid;
          b.refs.bar.hidden = true;
          b.refs.sz.textContent = fmtSize(b.size);
          syncSend();
          resolve(b);
        } else {
          fail(d.error || '上传失败');
        }
      };
      xhr.onerror = function () { fail('上传失败'); };
      xhr.send(b.file);
    });
  }

  /** 插到指定下标（compose 与 DOM 同步），用来把附件放在光标所在段落之后 */
  function insertBlockAt(b, idx) {
    var ref = compose[idx] || null;
    compose.splice(idx, 0, b);
    if (ref) blocksEl.insertBefore(b.el, ref.el);
    else blocksEl.appendChild(b.el);
  }

  function addFiles(files) {
    files = Array.prototype.slice.call(files || []).filter(Boolean);
    if (!files.length) return;

    // 附件插在「正在写的那一段」后面：那一段是空的就直接顶替它，
    // 已经有内容就新起一段接着写，不会在中间留一块空白。
    var anchor = textTarget();
    if (compose.indexOf(anchor) < 0) anchor = null;
    var anchorEmpty = !anchor || !anchor.el.value.trim();
    var base = anchor ? compose.indexOf(anchor) : compose.length;
    var at = anchorEmpty ? base : base + 1;

    var added = 0;
    files.forEach(function (f) {
      var isImg = /^image\//.test(f.type);
      if (isImg && !canSend('image')) { toast('主设备已关闭图片发送'); return; }
      if (!isImg && !canSend('file')) { toast('主设备已关闭文件发送'); return; }

      var b = {
        type: 'media',
        kind: isImg ? 'image' : 'file',
        file: f,
        name: f.name || ('粘贴图片-' + Date.now() + (isImg ? '.png' : '')),
        size: f.size,
        fid: ''
      };
      if (isImg) { try { b.preview = URL.createObjectURL(f); } catch (e) {} }

      b.el = buildMediaBlock(b);
      insertBlockAt(b, at + added);
      startUpload(b);
      added++;
    });

    if (!added) return;

    if (anchorEmpty) {
      // 空段落已经在附件后面，直接用它继续写
      if (anchor && anchor.el) anchor.el.focus();
    } else {
      var nb = newTextBlock();
      insertBlockAt(nb, at + added);
      nb.el.focus();
    }

    refreshPlaceholders();
    syncSend();
    if (previewOn) renderPreview();
  }

  function composeParts() {
    var out = [];
    compose.forEach(function (b) {
      if (b.type === 'text') {
        var t = b.el.value.trim();
        if (t) out.push({ type: 'text', text: t });
      } else if (b.fid) {
        out.push({ type: 'file', fid: b.fid });
      }
    });
    return out;
  }

  function hasContent() {
    return compose.some(function (b) {
      return b.type === 'text' ? !!b.el.value.trim() : !!b.fid;
    });
  }

  function syncSend() {
    var allowed = canSend('text') || canSend('image') || canSend('file');
    sendBtn.disabled = !allowed || !hasContent();

    var n = compose.filter(function (b) { return b.type === 'media'; }).length;
    if (n) {
      hintEl.hidden = false;
      hintEl.textContent = '将合并成 1 条消息 · ' + n + ' 个附件';
    } else if (lockedEl.hidden) {
      hintEl.hidden = false;
      hintEl.textContent = '拖拽文件到页面 · 可直接粘贴截图';
    }
  }

  function resetCompose() {
    compose.forEach(function (b) {
      if (b.preview) { try { URL.revokeObjectURL(b.preview); } catch (e) {} }
    });
    compose = [];
    lastText = null;
    blocksEl.innerHTML = '';
    addTextBlock(false);
    if (previewOn) togglePreview(false);
    syncSend();
  }

  async function sendAll() {
    if (sendBtn.disabled) return;
    sendBtn.disabled = true;
    try {
      if (compose.some(function (b) { return b.done; })) {
        await Promise.all(compose.map(function (b) { return b.done || null; }));
      }
      var bad = compose.filter(function (b) { return b.type === 'media' && !b.fid; });
      if (bad.length) {
        toast('有 ' + bad.length + ' 个附件没上传成功，移除后重发');
        return;
      }

      var parts = composeParts();
      if (!parts.length) return;

      await api('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cid: state.cid, to: state.toCid, parts: parts })
      });

      resetCompose();
      poll(true);
      toast(parts.length > 1 ? '已合并发送' : '已发送');
    } catch (e) {
      toast(e.message || '发送失败');
    } finally {
      syncSend();
    }
  }

  function onPaste(e) {
    if (!e.clipboardData) return;
    var files = Array.prototype.slice.call(e.clipboardData.files || []);
    if (!files.length) return;
    e.preventDefault();
    files.forEach(function (f, i) {
      if (!f.name) {
        try {
          f = new File([f], '粘贴图片-' + Date.now() + (i || '') + '.png', { type: f.type || 'image/png' });
        } catch (err) {}
      }
      addFiles([f]);
    });
  }

  /* ============================================================ 快捷输入 */
  /** 工具条往哪儿插：优先当前光标所在块，其次上次聚焦的块，最后末尾 */
  function textTarget() {
    var a = document.activeElement;
    for (var i = 0; i < compose.length; i++) {
      if (compose[i].type === 'text' && compose[i].el === a) return compose[i];
    }
    if (lastText && compose.indexOf(lastText) > -1) return lastText;
    for (var j = compose.length - 1; j >= 0; j--) {
      if (compose[j].type === 'text') return compose[j];
    }
    return addTextBlock(false);
  }

  function fireInput(ta) {
    ta.dispatchEvent(new Event('input'));
    autoGrowEl(ta);
    syncSend();
    if (previewOn) renderPreview();
  }

  function insertAt(str, caretOffset) {
    var b = textTarget(), ta = b.el;
    if (ta.disabled) { toast('主设备已关闭文字发送'); return; }
    ta.focus();
    var s = ta.selectionStart;
    if (s == null) s = ta.value.length;
    // 有选区时把光标收到选区末尾再插，别把刚被选中的文字覆盖掉
    if (ta.selectionEnd != null && ta.selectionEnd > s) s = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + str + ta.value.slice(s);
    var c = s + (caretOffset == null ? str.length : caretOffset);
    ta.selectionStart = ta.selectionEnd = c;
    lastText = b;
    fireInput(ta);
  }

  /** 把选区包进标记里（加粗 / 斜体 / 行内代码），没选中就放占位文字并选中它 */
  function wrapSelection(pre, post, place) {
    var b = textTarget(), ta = b.el;
    if (ta.disabled) { toast('主设备已关闭文字发送'); return; }
    ta.focus();
    var s = ta.selectionStart, e = ta.selectionEnd;
    if (s == null) { s = e = ta.value.length; }
    var sel = ta.value.slice(s, e) || place || '';
    ta.value = ta.value.slice(0, s) + pre + sel + post + ta.value.slice(e);
    var from = s + pre.length;
    ta.selectionStart = from;
    ta.selectionEnd = from + sel.length;
    lastText = b;
    fireInput(ta);
  }

  /** 对选区覆盖的每一行做变换（标题 / 引用 / 列表，再点一次取消） */
  function transformLines(fn) {
    var b = textTarget(), ta = b.el;
    if (ta.disabled) { toast('主设备已关闭文字发送'); return; }
    ta.focus();
    var v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
    if (s == null) { s = e = v.length; }
    var a = v.lastIndexOf('\n', Math.max(0, s - 1)) + 1;
    var z = v.indexOf('\n', e);
    if (z < 0) z = v.length;
    var lines = v.slice(a, z).split('\n');
    var next = lines.map(fn);
    ta.value = v.slice(0, a) + next.join('\n') + v.slice(z);
    ta.selectionStart = a;
    ta.selectionEnd = a + next.join('\n').length;
    lastText = b;
    fireInput(ta);
  }

  function insertLink() {
    var b = textTarget(), ta = b.el;
    if (ta.disabled) { toast('主设备已关闭文字发送'); return; }
    ta.focus();
    var s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
    var label = sel || '链接文字', url = 'https://';
    ta.value = ta.value.slice(0, s) + '[' + label + '](' + url + ')' + ta.value.slice(e);
    if (sel) {
      var from = s + 1 + label.length + 2;
      ta.selectionStart = from;
      ta.selectionEnd = from + url.length;
    } else {
      ta.selectionStart = s + 1;
      ta.selectionEnd = s + 1 + label.length;
    }
    lastText = b;
    fireInput(ta);
  }

  function runTool(name) {
    var b, v, lead;

    if (name === 'emoji') { toggleEmoji(); return; }
    if (name === 'preview') { togglePreview(); return; }

    if (name === 'hr') {
      b = textTarget(); v = b.el.value;
      lead = !v ? '' : (/\n\n$/.test(v) ? '' : (/\n$/.test(v) ? '\n' : '\n\n'));
      insertAt(lead + '---\n\n');
      return;
    }
    if (name === 'block') {
      b = textTarget(); v = b.el.value;
      lead = !v ? '' : (/\n$/.test(v) ? '' : '\n');
      insertAt(lead + '```\n\n```\n', lead.length + 4);
      return;
    }
    if (name === 'h') {
      transformLines(function (l) {
        return /^#{1,6}\s+/.test(l) ? l.replace(/^#{1,6}\s+/, '') : '## ' + l;
      });
      return;
    }
    if (name === 'quote') {
      transformLines(function (l) { return /^>\s?/.test(l) ? l.replace(/^>\s?/, '') : '> ' + l; });
      return;
    }
    if (name === 'list') {
      transformLines(function (l) {
        return /^[-*+]\s+/.test(l) ? l.replace(/^[-*+]\s+/, '') : '- ' + l;
      });
      return;
    }
    if (name === 'bold') { wrapSelection('**', '**', '加粗文字'); return; }
    if (name === 'italic') { wrapSelection('*', '*', '斜体文字'); return; }
    if (name === 'code') { wrapSelection('`', '`', '代码'); return; }
    if (name === 'link') { insertLink(); }
  }

      '🤗', '😏', '🙃', '😬', '👍', '👎', '👌', '🙏', '👏', '💪', '🤝', '👀', '✅', '❌', '⚠️', '❓',
      '❗', '🔥', '⭐', '💡', '🎉', '❤️', '💔', '✨', '🚀', '📌', '⏰', '🎯', '🧩', '🪄', '🍀', '☕']],
    ['物件', ['📎', '📁', '📄', '📝', '📊', '📈', '💻', '🖥', '📱', '⌨️', '🔋', '📷', '🎧', '💾', '🗂', '📦',

      '✗', '★', '☆', '§', '°', '±', '×', '÷', '≈', '≤', '≥', '∞', '【】', '「」', '『』', '《》']]
  ];
  var emojiPop = null, emojiOpen = false;

  function closeEmoji() {
    if (!emojiPop) return;
    emojiPop.classList.remove('on');
    emojiOpen = false;
    var btn = document.querySelector('[data-tool="emoji"]');
    if (btn) btn.classList.remove('on');
  }

  function buildEmojiPop() {
    if (emojiPop) return emojiPop;
    var pop = document.createElement('div');
    pop.className = 'emoji-pop';
    var tabs = document.createElement('div');
    tabs.className = 'emoji-tabs';
    var grid = document.createElement('div');
    grid.className = 'emoji-grid';

    function fill(idx) {
      grid.innerHTML = '';
      EMOJI_GROUPS[idx][1].forEach(function (ch) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = ch;
        btn.onclick = function () { insertAt(ch); };
        grid.appendChild(btn);
      });
      Array.prototype.forEach.call(tabs.children, function (t, i) {
        t.classList.toggle('on', i === idx);
      });
    }

    EMOJI_GROUPS.forEach(function (g, i) {
      var t = document.createElement('button');
      t.type = 'button';
      t.className = 'emoji-tab';
      t.textContent = g[0];
      t.onclick = function () { fill(i); };
      tabs.appendChild(t);
    });

    pop.appendChild(tabs);
    pop.appendChild(grid);
    document.body.appendChild(pop);
    fill(0);
    emojiPop = pop;

    document.addEventListener('pointerdown', function (e) {
      if (!emojiOpen) return;
      var t = e.target;
      if (pop.contains(t)) return;
      if (t && t.closest && t.closest('[data-tool="emoji"]')) return;
      closeEmoji();
    });
    document.addEventListener('keydown', function (e) {
      if (emojiOpen && e.key === 'Escape') closeEmoji();
    });
    return pop;
  }

  function toggleEmoji() {
    var btn = document.querySelector('[data-tool="emoji"]');
    var pop = buildEmojiPop();
    if (emojiOpen) { closeEmoji(); return; }
    pop.classList.add('on');
    emojiOpen = true;
    btn.classList.add('on');

    var r = btn.getBoundingClientRect();
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    var top = r.top - h - 10;
    if (top < 8) top = r.bottom + 10;
    pop.style.left = Math.round(left) + 'px';
    pop.style.top = Math.round(top) + 'px';
  }

  /* ---- Markdown 预览 ---- */
  var previewOn = false;

  function renderPreview() {
    var mdp = $('mdp');
    var html = '', atts = '';
    compose.forEach(function (b) {
      if (b.type === 'text') {
        var t = b.el.value.trim();
        if (t) html += mdToHtml(t);
      } else {
        atts += '<span class="mdp-att">' + (b.kind === 'image' ? '🖼' : '📎') +
          '<b>' + esc(b.name || '') + '</b><i>' + fmtSize(b.size) + '</i></span>';
      }
    });
    mdp.innerHTML = (html || '<div class="mdp-empty">还没有输入内容，点「编辑」回去写</div>') +
      (atts ? '<div class="mdp-atts">' + atts + '</div>' : '');
  }

  function togglePreview(force) {
    previewOn = force == null ? !previewOn : !!force;
    $('composer').classList.toggle('prev-on', previewOn);
    var pb = $('previewBtn');
    if (!pb) return;
    pb.classList.toggle('on', previewOn);
    pb.textContent = previewOn ? '编辑' : '预览';
    if (previewOn) renderPreview();
  }

  $('mtoolsWrap').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-tool]') : null;
    if (!btn) return;
    runTool(btn.dataset.tool);
  });

  ['feed', 'mdp'].forEach(function (id) {
    $(id).addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.code-copy') : null;
      if (!btn) return;
      var box = btn.closest('.code');
      var code = box && box.querySelector('code');
      if (code) copyText(code.textContent);
    });
  });

  /* ============================================================ 设备授权 */
  function buildDeviceSection() {
    var box = document.createElement('div');
    box.className = 'dev-sec';

    var head = document.createElement('div');
    head.className = 'dev-head';
    var htxt = document.createElement('span');
    htxt.textContent = '设备授权';
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.hidden = true;
    head.appendChild(htxt);
    head.appendChild(tag);
    box.appendChild(head);

    var listEl = document.createElement('div');
    box.appendChild(listEl);

    var hint = document.createElement('div');
    hint.className = 'dev-hint';
    hint.textContent = '同意后长期有效，不用每次重新验证；移除授权后，那台设备要重新输密码并由你再确认一次。';
    box.appendChild(hint);

    function row(name, sub, actions) {
      var el = document.createElement('div');
      el.className = 'dev-row';
      var ava = document.createElement('span');
      ava.className = 'dev-ava';
      ava.style.background = colorOf(name || '?');
      ava.textContent = String(name || '?').slice(0, 1).toUpperCase();
      var txt = document.createElement('div');
      txt.className = 'dev-txt';
      var nm = document.createElement('div');
      nm.className = 'dev-name';
      nm.textContent = name || '未知设备';
      var sb = document.createElement('div');
      sb.className = 'dev-sub';
      sb.textContent = sub;
      txt.appendChild(nm);
      txt.appendChild(sb);
      var acts = document.createElement('div');
      acts.className = 'dev-acts';
      actions.forEach(function (a) {
        var b = document.createElement('button');
        b.className = 'mini ' + (a.cls || '');
        b.textContent = a.label;
        b.onclick = a.fn;
        acts.appendChild(b);
      });
      el.appendChild(ava);
      el.appendChild(txt);
      el.appendChild(acts);
      return el;
    }

    function act(kind, ip) {
      api('/api/devices/' + kind, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ip: ip })
      }).then(function () {
        toast(kind === 'approve' ? '已同意接入' : '已拒绝接入');
        load();
      }).catch(function (e) { toast(e.message || '操作失败'); });
    }

    function removeDevice(v) {
      Dialog.confirm({
        title: '移除这台设备的授权？',
        desc: (v.name || v.ip) + ' 会立刻被挡在外面，要重新输入密码并由你再同意一次。',
        ok: '移除授权', danger: true
      }).then(function (ok) {
        if (!ok) return;
        api('/api/devices?ip=' + encodeURIComponent(v.ip), { method: 'DELETE' })
          .then(function () { toast('已移除授权'); load(); })
          .catch(function (e) { toast(e.message || '移除失败'); });
      });
    }

    function paint(d) {
      var pend = d.pending || [];
      var devs = d.devices || [];
      tag.hidden = !pend.length;
      tag.textContent = pend.length ? pend.length + ' 台待确认' : '';

      listEl.innerHTML = '';
      pend.forEach(function (p) {
        listEl.appendChild(row(p.name || p.ip, (p.ip || '') + ' · 正在申请接入', [
          { label: '同意', cls: 'ok', fn: function () { act('approve', p.ip); } },
          { label: '拒绝', cls: 'bad', fn: function () { act('reject', p.ip); } }
        ]));
      });
      if (devs.length) {
        devs.forEach(function (v) {
          listEl.appendChild(row(v.name || v.ip, (v.ip || '') + ' · 已授权', [
            { label: '移除', cls: 'bad', fn: function () { removeDevice(v); } }
          ]));
        });
      } else if (!pend.length) {
        var e = document.createElement('div');
        e.className = 'dev-empty';
        e.textContent = '还没有其他设备获得授权';
        listEl.appendChild(e);
      }
    }

    function load() {
      api('/api/devices').then(paint).catch(function () {});
    }

    load();
    var timer = setInterval(load, 2000);
    return { el: box, stop: function () { clearInterval(timer); } };
  }

  /* ============================================================ 设置 / 外观 */
  function openSettings() {
    var wrapEl = document.createElement('div');
    var rows = [
      ['allowSend', '允许其他设备发送', '关闭后只有主设备能发内容'],
      ['allowText', '允许发送文字', ''],
      ['allowImage', '允许发送图片', ''],
      ['allowFile', '允许发送文件', '']
    ];
    var boxes = {};
    rows.forEach(function (r) {
      var lab = document.createElement('label');
      lab.className = 'sw';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!state.settings[r[0]];
      var track = document.createElement('span');
      track.className = 'track';
      var txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = r[1];
      if (r[2]) {
        var small = document.createElement('small');
        small.textContent = r[2];
        txt.appendChild(small);
      }
      lab.appendChild(cb); lab.appendChild(track); lab.appendChild(txt);
      wrapEl.appendChild(lab);
      boxes[r[0]] = cb;
    });

    function syncDeps() {
      var on = boxes.allowSend.checked;
      ['allowText', 'allowImage', 'allowFile'].forEach(function (k) {
        boxes[k].disabled = !on;
        if (!on) boxes[k].checked = false;
      });
    }
    boxes.allowSend.addEventListener('change', syncDeps);
    syncDeps();

    var devSec = buildDeviceSection();
    wrapEl.appendChild(devSec.el);

    Dialog.open({
      title: '主设备设置',
      desc: '这里的开关只约束其他设备，主设备始终拥有完整权限。',
      body: wrapEl,
      actions: [
        { label: '关闭', value: null },
        { label: '保存', value: 'save', kind: 'primary' }
      ]
    }).then(function (v) {
      devSec.stop();
      if (v !== 'save') return;
      var payload = {};
      Object.keys(boxes).forEach(function (k) { payload[k] = boxes[k].checked; });
      api('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function (d) {
        if (d.settings) state.settings = d.settings;
        applyPermissions();
        toast('设置已保存');
      }).catch(function (e) { toast(e.message || '保存失败'); });
    });
  }

  function openTheme() {

      b.innerHTML = '<span class="theme-swatch ' + t.cls + '"></span><span>' + t.label + '</span>';

    Dialog.open({

      desc: '选一个顺眼的，会记在这台设备上。',
      body: wrapEl,
      actions: [{ label: '完成', value: true, kind: 'primary' }]
    });
  }

  /* ============================================================ 扫码访问 */
  async function openQr() {
    var info = {};
    try { info = await api('/api/info'); } catch (e) { /* 用当前地址兜底 */ }

    var urls = (info.urls || []).slice();
    if (!urls.length) urls = ['http://' + location.host];
    var cur = 0;

    var wrapEl = document.createElement('div');
    wrapEl.className = 'qr-wrap';

    var boxEl = document.createElement('div');
    boxEl.className = 'qr-box';
    var img = document.createElement('img');
    img.alt = '扫码访问';
    boxEl.appendChild(img);

    var urlEl = document.createElement('div');
    urlEl.className = 'qr-url';

    var copyBtn = document.createElement('button');
    copyBtn.className = 'mini';
    copyBtn.textContent = '复制链接';

    var ipsEl = document.createElement('div');
    ipsEl.className = 'qr-ips';

    var tip = document.createElement('div');
    tip.className = 'qr-tip';
    tip.textContent = '对方扫开后会要求输入接入密码（默认 XM），再由你在这里点「同意」。';

    wrapEl.appendChild(boxEl);
    wrapEl.appendChild(urlEl);
    wrapEl.appendChild(copyBtn);
    wrapEl.appendChild(ipsEl);
    wrapEl.appendChild(tip);

    function ipOf(u) {
      var m = /^https?:\/\/([^:/]+)/.exec(u);
      return m ? m[1] : u;
    }
    function select(i) {
      cur = i;
      var u = urls[i];
      img.src = '/api/qr?px=560&ip=' + encodeURIComponent(ipOf(u));
      urlEl.textContent = u;
      Array.prototype.forEach.call(ipsEl.children, function (b, k) {
        b.classList.toggle('on', k === i);
      });
    }
    urls.forEach(function (u, i) {
      var b = document.createElement('button');
      b.className = 'qr-ip';
      b.textContent = ipOf(u);
      b.title = u;
      b.onclick = function () { select(i); };
      ipsEl.appendChild(b);
    });
    if (urls.length < 2) ipsEl.hidden = true;
    copyBtn.onclick = function () { copyText(urls[cur]); };
    select(0);

    Dialog.open({
      title: '扫码访问',
      desc: '手机和电脑连同一个 Wi-Fi，扫码即可打开这个页面。',
      body: wrapEl,
      actions: [{ label: '完成', value: true, kind: 'primary' }]
    });
  }

  async function renameSelf() {
    var v = await Dialog.prompt({
      title: '给这台设备改名',
      desc: '留空则恢复自动名称（设备型号 + IP，保证不重名）。',
      value: state.me ? state.me.name : '',
      placeholder: '例如 小毛的 MacBook'
    });
    if (v === null) return;
    try {
      var d = await api('/api/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cid: state.cid, name: v })
      });
      if (d.me) state.me = d.me;
      syncWho();
      poll(true);
      toast(v ? '已改名' : '已恢复自动名称');
    } catch (e) { toast(e.message || '改名失败'); }
  }

  /* ============================================================ 事件 */
  $('themeBtn').addEventListener('click', openTheme);
  $('qrBtn').addEventListener('click', openQr);
  $('settingsBtn').addEventListener('click', openSettings);
  $('who').addEventListener('click', renameSelf);
  $('toBtn').addEventListener('click', openTargetPicker);

  // 输入条吸顶：滚动后加分隔线与投影
  var composerBar = $('composerBar');
  function onScroll() {
    composerBar.classList.toggle('stuck', (window.scrollY || window.pageYOffset || 0) > 56);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  sendBtn.addEventListener('click', sendAll);

  pickBtn.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    addFiles(fileInput.files);
    fileInput.value = '';
  });

  clearBtn.addEventListener('click', async function () {
    if (!nodes.size) return toast('已经是空的了');
    var ok = await Dialog.confirm({
      title: '清空全部内容？',
      desc: '所有文件和文字都会从本机删除，不可恢复。',
      ok: '全部清空', danger: true
    });
    if (!ok) return;
    try {
      await api('/api/all', { method: 'DELETE' });
      poll(true);
      toast('已清空');
    } catch (e) { toast(e.message || '清空失败'); }
  });

  // 拖拽
  var dropEl = $('drop'), dragDepth = 0;
  window.addEventListener('dragenter', function (e) {
    if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') === -1) return;
    dragDepth++; dropEl.classList.add('on');
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('dragleave', function () {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) dropEl.classList.remove('on');
  });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; dropEl.classList.remove('on');
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // 粘贴（文件级别的粘贴由输入块自己处理，这里兜底全页面）
  document.addEventListener('paste', function (e) {
    if (!e.clipboardData) return;
    var files = Array.prototype.slice.call(e.clipboardData.files || []);
    if (!files.length) return;
    e.preventDefault();
    files.forEach(function (f, i) {
      if (!f.name) {
        try {
          f = new File([f], '粘贴图片-' + Date.now() + (i || '') + '.png', { type: f.type || 'image/png' });
        } catch (err) {}
      }
      addFiles([f]);
    });
  });

  // 灯箱
  var lb = $('lb');
  function openLb(src) {
    $('lbImg').src = src;
    $('lbOpen').href = src;
    lb.classList.add('on');
  }
  $('lbClose').onclick = function () { lb.classList.remove('on'); };
  lb.addEventListener('click', function (e) { if (e.target === lb) lb.classList.remove('on'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') lb.classList.remove('on'); });

  /* ============================================================ 启动 */
  function launch(d) {
    Gate.close();
    applyHello(d);
    renderToChip();
    poll(true);
    startPolling();
    if (!compose.length) addTextBlock(false);
    syncSend();
  }

  (async function boot() {
    var addr = $('addr');
    addr.textContent = location.host;

    var info = null;
    try {
      info = await fetch('/api/info', { cache: 'no-store' }).then(function (r) { return r.json(); });
      addr.title = (info.urls || []).join('  ');
      addr.textContent = location.host;
    } catch (e) { /* 后面 hello 会报错 */ }

    var d = null;
    try {
      d = await api('/api/hello', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cid: state.cid, ua: navigator.userAgent })
      });
    } catch (e) {
      toast('连不上服务，请确认地址是否正确');
    }

    if (d && d.authorized === false) {
      Gate.open(d.status, {
        info: { ip: d.ip || (info && info.ip), host: info && info.host, urls: info && info.urls },
        onPass: launch
      });
      return;
    }

    if (!d && info) {
      // hello 失败但 info 说已授权：可能只是瞬时抖动，按已授权继续
      if (info.authorized === false) {
        Gate.open(info.status, { info: info, onPass: launch });
        return;
      }
    }
    launch(d);
  })();
})();
</script>
</body>
</html>
