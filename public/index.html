<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>XiaoMao 互传</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}

  /* ---------------- 主题变量 ---------------- */
  :root{
    --bg:#f2f4f7;
    --bg-image:radial-gradient(1100px 520px at 6% -10%, #dde5f8 0%, transparent 58%),
               radial-gradient(900px 460px at 100% -4%, #ece0f8 0%, transparent 52%);
    --card:#ffffff; --card-2:#f7f9fc;
    --text:#14171c; --sub:#6b7484; --faint:#9aa3b2;
    --line:#e6e9ef; --line-soft:#eef1f6;
    --accent:#4c6ef5; --accent-soft:#eaefff; --brand:#e8562f;
    --ok:#12b886; --danger:#e5484d;
    --header:rgba(255,255,255,.84);
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px -14px rgba(16,24,40,.22);
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --glass:0px;
  }
  :root[data-theme="dark"]{
    --bg:#0d1015;
    --bg-image:radial-gradient(900px 420px at 8% -8%, #17203a 0%, transparent 60%);
    --card:#161b22; --card-2:#1b2129;
    --text:#e7ecf3; --sub:#8c96a8; --faint:#5f6b7d;
    --line:#242c37; --line-soft:#1d242e;
    --accent:#6b8afd; --accent-soft:#1d2740;
    --header:rgba(13,16,21,.80);
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.7);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --glass:0px;
  }
  :root[data-theme="glass"]{
    --bg:#e9eefa;
    --bg-image:radial-gradient(760px 620px at 8% 0%, #a9c8ff 0%, transparent 62%),
               radial-gradient(700px 620px at 96% 4%, #f7c2f0 0%, transparent 58%),
               radial-gradient(760px 560px at 50% 108%, #b9f4dc 0%, transparent 62%),
               radial-gradient(520px 420px at 78% 62%, #ffe6b8 0%, transparent 60%);
    --card:rgba(255,255,255,.52); --card-2:rgba(255,255,255,.40);
    --text:#161c28; --sub:#4a5568; --faint:#6b7788;
    --line:rgba(255,255,255,.72); --line-soft:rgba(255,255,255,.55);
    --accent:#3f63f0; --accent-soft:rgba(255,255,255,.55);
    --header:rgba(255,255,255,.55);
    --shadow:0 10px 40px -14px rgba(28,42,74,.30);
    --shadow-sm:0 4px 16px -8px rgba(28,42,74,.22);
    --glass:18px;
  }

  html,body{margin:0;padding:0}
  body{
    min-height:100vh; display:flex; flex-direction:column;
    color:var(--text); background-color:var(--bg); background-image:var(--bg-image);
    background-attachment:fixed; background-repeat:no-repeat;
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  /* 毛玻璃主题：所有卡片透出背景 */
  :root[data-theme="glass"] .card,
  :root[data-theme="glass"] .composer,
  :root[data-theme="glass"] .peer,
  :root[data-theme="glass"] .chip,
  :root[data-theme="glass"] .btn.ghost,
  :root[data-theme="glass"] .dl,
  :root[data-theme="glass"] .dlg,
  :root[data-theme="glass"] .theme-opt{
    -webkit-backdrop-filter:blur(var(--glass)) saturate(170%);
    backdrop-filter:blur(var(--glass)) saturate(170%);
  }

  /* ---------------- 顶栏 ---------------- */
  .top{
    position:sticky; top:0; z-index:30;
    background:var(--header);
    -webkit-backdrop-filter:saturate(180%) blur(16px); backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--line);
  }
  .top-in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:11px}
  .mark{
    width:38px;height:38px;border-radius:12px;flex:none;overflow:hidden;
    background:#fff;border:1px solid var(--line);
    box-shadow:0 3px 10px -4px rgba(16,24,40,.28);
  }
  .mark img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
  .headtext{min-width:0}
  .title{font-size:15px;font-weight:650;letter-spacing:.2px;line-height:1.2;white-space:nowrap}
  .title .brand{color:var(--brand);font-weight:750;letter-spacing:.1px}
  .addr{
    font-size:11.5px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw;
  }
  .spacer{flex:1}
  .chip{
    display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;
    background:var(--card); border:1px solid var(--line); color:var(--sub);
    font-size:12.5px;cursor:pointer;white-space:nowrap;max-width:250px;
    box-shadow:var(--shadow-sm); transition:.15s; font-family:inherit;
  }
  .chip:hover{border-color:var(--accent);color:var(--text)}
  .chip b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px rgba(18,184,134,.16)}
  .ibtn{
    width:32px;height:32px;flex:none;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--sub);cursor:pointer;display:grid;place-items:center;
    transition:.15s;box-shadow:var(--shadow-sm);
  }
  .ibtn:hover{color:var(--text);border-color:var(--faint)}
  .ibtn svg{width:16px;height:16px;display:block}
  .ibtn.admin{color:var(--brand);border-color:rgba(232,86,47,.35)}
  @media (max-width:430px){ .chip{max-width:104px} }
  /* 窄屏：顶栏按钮变多，设备名收进小圆点，别把标题挤掉 */
  @media (max-width:520px){
    .top-in{gap:8px;padding:9px 12px}
    .mark{width:34px;height:34px;border-radius:10px}
    .chip#who{width:32px;max-width:32px;padding:0;justify-content:center}
    .chip#who b{display:none}
    .ibtn{width:30px;height:30px}
    .addr{max-width:36vw}
  }

  /* ---------------- 布局 ---------------- */
  .wrap{max-width:760px;width:100%;margin:0 auto;padding:16px 14px 40px;flex:1 0 auto}

  /* 输入条：滚动时吸顶悬浮 */
  .composer-bar{
    position:sticky; top:59px; z-index:25;
    padding:9px 0 8px;
    background:var(--header);
    -webkit-backdrop-filter:blur(16px) saturate(170%); backdrop-filter:blur(16px) saturate(170%);
    transition:box-shadow .22s, border-color .22s;
    border-bottom:1px solid transparent;
  }
  .composer-bar:after{
    content:''; position:absolute; left:0; right:0; bottom:-11px; height:11px;
    background:linear-gradient(to bottom, var(--header), transparent);
    opacity:0; transition:opacity .22s; pointer-events:none;
  }
  .composer-bar.stuck{border-bottom-color:var(--line);box-shadow:0 10px 24px -20px rgba(16,24,40,.55)}
  .composer-bar.stuck:after{opacity:1}
  .composer-wrap{max-width:760px;margin:0 auto;padding:0 14px}

  /* ---------------- 输入区 ---------------- */
  .composer{
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;
    box-shadow:var(--shadow); transition:border-color .18s;
  }
  .composer:focus-within{border-color:var(--accent)}
  .bar{display:flex;align-items:center;gap:8px;margin-top:8px}
  .btn{
    appearance:none;border:0;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;
    height:34px;padding:0 14px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;
    transition:.15s;white-space:nowrap;font-family:inherit;
  }
  .btn svg{width:14px;height:14px;flex:none}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 12px -4px rgba(76,110,245,.6)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.primary:disabled{opacity:.4;cursor:default;filter:none;box-shadow:none}
  .btn.ghost{background:var(--card-2);color:var(--sub);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--text);border-color:var(--faint)}
  .btn.ghost:disabled{opacity:.45;cursor:not-allowed}
  .btn.danger{background:var(--danger);color:#fff}
  .hint{font-size:12px;color:var(--faint);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:430px){ .hint{display:none} #send{margin-left:auto} .pick-label{display:none} #pick{padding:0 10px} }

  /* 发送对象选择 */
  .to-chip{
    display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;border-radius:10px;
    background:var(--card-2);border:1px solid var(--line);color:var(--sub);
    font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;max-width:160px;flex:none;transition:.15s;
  }
  .to-chip svg{width:13px;height:13px;flex:none}
  .to-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .to-chip:hover{color:var(--text);border-color:var(--faint)}
  .to-chip.private{color:var(--brand);border-color:rgba(232,86,47,.42);background:rgba(232,86,47,.08)}
  @media (max-width:430px){ .to-chip{max-width:96px} }

  /* 私聊标记 */
  .pv{
    font-size:9.5px;font-weight:700;color:var(--brand);background:rgba(232,86,47,.12);
    padding:1.5px 5px;border-radius:5px;flex:none;letter-spacing:.2px;
    max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* 选择对象的列表 */
  .pick-list{margin-top:14px;display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow:auto;margin-right:-6px;padding-right:6px}
  .pick-row{
    display:flex;align-items:center;gap:10px;width:100%;padding:9px 8px;border-radius:11px;
    border:0;background:transparent;cursor:pointer;font:inherit;text-align:left;color:var(--text);transition:.13s;
  }
  .pick-row:hover{background:var(--card-2)}
  .pick-row.on{background:var(--accent-soft)}
  .pick-ava{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
  .pick-txt{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center}
  .pick-name{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick-sub{display:block;font-size:11.5px;color:var(--faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick-check{width:16px;height:16px;flex:none;color:var(--accent)}
  .locked{
    margin-top:9px;padding:8px 11px;border-radius:10px;font-size:12px;
    background:rgba(232,86,47,.09);color:#c2410c;display:flex;align-items:center;gap:6px;line-height:1.5;
  }
  :root[data-theme="dark"] .locked{color:#ffb08a;background:rgba(232,86,47,.14)}
  .locked svg{width:13px;height:13px;flex:none}

  /* ---------------- 在线设备 ---------------- */
  .peers{margin-top:18px}
  .peers-head{display:flex;align-items:center;gap:7px;margin:0 2px 8px;font-size:12px;color:var(--sub);font-weight:600}
  .count-pill{
    min-width:18px;height:18px;padding:0 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);
    font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
  }
  .peer-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 5px;scrollbar-width:none}
  .peer-row::-webkit-scrollbar{display:none}
  .peer{
    display:flex;align-items:center;gap:8px;flex:none;max-width:320px;height:38px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 11px 0 9px;
    box-shadow:var(--shadow-sm);
  }
  .peer.me{border-color:var(--accent);box-shadow:0 0 0 2.5px var(--accent-soft)}
  .pava{
    width:22px;height:22px;border-radius:7px;flex:none;display:grid;place-items:center;
    color:#fff;font-size:11px;font-weight:700;
  }
  .pname{font-size:12.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pbadge{
    font-size:9.5px;font-weight:700;color:var(--brand);background:rgba(232,86,47,.13);
    padding:1.5px 5px;border-radius:5px;flex:none;letter-spacing:.3px;
  }

  /* ---------------- 工具条 / 卡片 ---------------- */
  .toolbar{display:flex;align-items:center;gap:8px;margin:20px 2px 10px}
  .count{font-size:12.5px;color:var(--sub);font-weight:500}
  .link{font-size:12.5px;color:var(--sub);background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:8px;font-family:inherit}
  .link:hover{color:var(--danger);background:var(--card-2)}

  .feed{display:flex;flex-direction:column;gap:10px}
  .card{
    position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:12px 14px;box-shadow:var(--shadow-sm); animation:in .28s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--faint);margin-bottom:8px}
  .ava{
    width:20px;height:20px;border-radius:7px;flex:none;display:grid;place-items:center;
    font-size:10.5px;font-weight:700;color:#fff;
  }
  .who{color:var(--sub);font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
  .when{flex:none;white-space:nowrap}
  .acts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:.18s}
  .card:hover .acts{opacity:1}
  @media (hover:none){ .acts{opacity:.9} }
  .icon{
    width:26px;height:26px;border-radius:8px;border:0;background:transparent;color:var(--faint);
    cursor:pointer;display:grid;place-items:center;transition:.15s;
  }
  .icon:hover{background:var(--card-2);color:var(--text)}
  .icon.del:hover{color:var(--danger)}
  .icon svg{width:15px;height:15px;display:block}

  .text-body{font-size:14.5px;line-height:1.62;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
  .text-body.clamp{
    max-height:10.6em;overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom,#000 68%,transparent);
    mask-image:linear-gradient(to bottom,#000 68%,transparent);
  }
  .more{
    display:inline-flex;align-items:center;gap:4px;margin-top:2px;padding:3px 0;
    background:none;border:0;color:var(--accent);font:inherit;font-size:12.5px;font-weight:650;
    cursor:pointer;letter-spacing:.2px;
  }
  .more:hover{text-decoration:underline}
  .text-body a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(76,110,245,.35)}
  .text-body a:hover{border-bottom-color:var(--accent)}

  /* ---- Markdown 渲染（消息卡片 / 输入预览共用） ---- */
  .md{white-space:normal;font-size:14.5px;line-height:1.66;word-break:break-word;overflow-wrap:anywhere}
  .md>*:first-child{margin-top:0}
  .md>*:last-child{margin-bottom:0}
  .md p{margin:0 0 .6em}
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:.9em 0 .38em;line-height:1.3;font-weight:750;letter-spacing:-.012em}
  .md h1{font-size:1.44em}
  .md h2{font-size:1.26em}
  .md h3{font-size:1.12em}
  .md h4{font-size:1.02em}
  .md h5,.md h6{font-size:.94em;color:var(--sub)}
  .md ul,.md ol{margin:.22em 0 .7em;padding-left:1.32em}
  .md li{margin:.18em 0}
  .md ul{list-style:disc}
  .md ol{list-style:decimal}
  .md li::marker{color:var(--faint)}
  .md blockquote{margin:.55em 0;padding:.1em 0 .1em .82em;border-left:3px solid var(--line);color:var(--sub)}
  .md blockquote p:last-child{margin-bottom:0}
  .md hr{border:0;border-top:1px solid var(--line);margin:1.05em 0}
  .md a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(76,110,245,.35)}
  .md a:hover{border-bottom-color:var(--accent)}
  .md code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;
    background:var(--line-soft);border-radius:5px;padding:1.5px 4px;
  }
  .md .code{margin:.66em 0;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card-2)}
  .md .code-hd{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 11px;border-bottom:1px solid var(--line-soft)}
  .md .code-lang{
    font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .md .code-copy{
    margin-left:auto;height:23px;padding:0 8px;border:0;border-radius:6px;background:transparent;
    color:var(--faint);font:inherit;font-size:11.5px;cursor:pointer;
  }
  .md .code-copy:hover{background:var(--line);color:var(--text)}
  .md .code pre{margin:0;padding:10px 12px;overflow:auto;max-height:380px}
  .md .code code{background:none;padding:0;border-radius:0;font-size:12.5px;line-height:1.62;white-space:pre;display:block}
  .md table{border-collapse:collapse;margin:.6em 0;font-size:.94em;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left}
  .md th{background:var(--card-2);font-weight:650}
  .md del{opacity:.65}
  .md .task{margin-right:4px}

  .thumb{
    display:block;max-width:100%;max-height:340px;border-radius:11px;cursor:zoom-in;
    background:var(--card-2);border:1px solid var(--line-soft);
  }
  .imgname{font-size:11.5px;color:var(--faint);margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .file{display:flex;align-items:center;gap:11px}
  .fico{
    width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.3px;
    text-transform:uppercase;
  }
  .fname{font-size:14px;font-weight:550;word-break:break-all;line-height:1.4}
  .fsize{font-size:11.5px;color:var(--faint);margin-top:2px}
  .dl{
    margin-left:auto;flex:none;height:32px;padding:0 12px;border-radius:9px;white-space:nowrap;
    background:var(--card-2);border:1px solid var(--line);color:var(--sub);
    font-size:12.5px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:.15s;
  }
  .dl:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .dl svg{width:13px;height:13px;flex:none}

  .empty{text-align:center;padding:48px 20px;color:var(--faint)}
  .empty .logo{
    width:56px;height:56px;border-radius:17px;margin:0 auto 14px;overflow:hidden;
    background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px -8px rgba(16,24,40,.3);
  }
  .empty .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .empty p{margin:0;font-size:13.5px;line-height:1.7}

  .foot{
    max-width:760px;width:100%;margin:0 auto;padding:20px 16px calc(22px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:11.5px;color:var(--faint);letter-spacing:.2px;
  }
  .foot b{color:var(--brand);font-weight:700;letter-spacing:.3px}
  .foot .sep{opacity:.5}

  /* ---------------- 弹窗组件 ---------------- */
  .dlg-mask{
    position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:20px;
    background:rgba(12,15,20,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    animation:fade .18s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .dlg-mask.out{animation:fadeout .17s ease forwards}
  @keyframes fadeout{to{opacity:0}}
  .dlg{
    width:100%;max-width:390px;background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:20px;box-shadow:0 24px 64px -20px rgba(0,0,0,.45);
    animation:pop .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  .dlg h3{margin:0 0 6px;font-size:16px;font-weight:650;letter-spacing:.2px}
  .dlg p{margin:0;font-size:13.5px;color:var(--sub);line-height:1.62}
  .dlg-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .dlg input[type=text]{
    width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);
    color:var(--text);font:inherit;font-size:14px;padding:0 13px;margin-top:14px;outline:0;
  }
  .dlg input[type=text]:focus{border-color:var(--accent)}
  @media (max-width:520px){
    .dlg-mask{align-items:flex-end;padding:0}
    .dlg{
      max-width:none;border-radius:20px 20px 0 0;
      padding:20px 18px calc(18px + env(safe-area-inset-bottom));
      animation:up .26s cubic-bezier(.2,.8,.3,1);
    }
    @keyframes up{from{transform:translateY(100%)}to{transform:none}}
    .dlg-acts{flex-direction:column-reverse}
    .dlg-acts .btn{width:100%;justify-content:center;height:44px;font-size:14px}
  }

  /* 开关 */
  .sw{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
  .sw:last-child{border-bottom:0}
  .sw input{position:absolute;opacity:0;width:0;height:0}
  .sw .track{
    width:42px;height:25px;border-radius:99px;background:var(--line);position:relative;
    transition:.2s;flex:none;
  }
  .sw .track:after{
    content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
    background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.22);
  }
  .sw input:checked + .track{background:var(--accent)}
  .sw input:checked + .track:after{transform:translateX(17px)}
  .sw input:disabled + .track{opacity:.4}
  .sw input:disabled ~ .txt{opacity:.45}
  .sw .txt{font-size:13.5px;line-height:1.4}
  .sw .txt small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px;line-height:1.5}

  /* 主题选择 */
  .theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
  .theme-opt{
    display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 6px;border-radius:14px;
    border:1px solid var(--line);background:var(--card-2);color:var(--sub);
    font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;
  }
  .theme-opt:hover{color:var(--text);border-color:var(--faint)}
  .theme-opt.on{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 3px var(--accent-soft)}
  .theme-swatch{
    width:100%;height:46px;border-radius:9px;border:1px solid rgba(0,0,0,.07);position:relative;overflow:hidden;
  }
  .theme-swatch:after{
    content:'';position:absolute;left:7px;right:7px;bottom:6px;height:9px;border-radius:4px;
  }
  .sw-light{background:linear-gradient(160deg,#ffffff,#eef1f6)}
  .sw-light:after{background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .sw-dark{background:linear-gradient(160deg,#1c222b,#0d1015)}
  .sw-dark:after{background:#2a323d}
  .sw-glass{background:linear-gradient(150deg,#a9c8ff,#f7c2f0 55%,#b9f4dc)}
  .sw-glass:after{background:rgba(255,255,255,.62)}

  /* ---------------- 浮层 ---------------- */
  .drop{
    position:fixed;inset:0;z-index:80;display:none;place-items:center;
    background:rgba(12,15,20,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .drop.on{display:grid}
  .drop-in{
    border:2px dashed rgba(255,255,255,.72);border-radius:22px;padding:36px 50px;color:#fff;
    font-size:15px;font-weight:600;text-align:center;background:rgba(255,255,255,.08);pointer-events:none;
  }
  .lightbox{
    position:fixed;inset:0;z-index:90;display:none;place-items:center;
    background:rgba(8,10,14,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:20px;
  }
  .lightbox.on{display:grid}
  .lightbox img{max-width:100%;max-height:92vh;border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
  .lb-close{
    position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;
    width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;
    font-size:19px;cursor:pointer;display:grid;place-items:center;
  }
  .lb-open{
    position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    color:#fff;font-size:13px;text-decoration:none;background:rgba(255,255,255,.14);
    padding:8px 16px;border-radius:99px;
  }
  .toasts{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));
    z-index:140;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
  }
  .toast{
    background:rgba(20,23,28,.94);color:#fff;font-size:13px;padding:9px 16px;border-radius:11px;
    box-shadow:0 8px 24px rgba(0,0,0,.28);animation:tin .22s ease;max-width:80vw;text-align:center;
  }
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---- 接入许可（未授权设备看到的界面） ---- */
  .gate{
    position:fixed;inset:0;z-index:150;display:none;place-items:center;padding:24px;
    background-color:var(--bg);background-image:var(--bg-image);background-size:cover;
  }
  .gate.on{display:grid}
  .gate-card{
    width:100%;max-width:372px;text-align:center;padding:30px 26px;
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    box-shadow:0 26px 64px -34px rgba(16,24,40,.55);
  }
  :root[data-theme="glass"] .gate-card{-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  .gate-logo{
    width:62px;height:62px;margin:0 auto 15px;border-radius:17px;overflow:hidden;
    background:#fff;border:1px solid var(--line);
  }
  .gate-logo img{width:100%;height:100%;object-fit:cover;display:block}
  .gate h2{margin:0 0 7px;font-size:17px;font-weight:650;letter-spacing:.2px}
  .gate p{margin:0;font-size:13px;color:var(--sub);line-height:1.68}
  .gate-form{margin-top:17px;display:flex;flex-direction:column;gap:9px}
  .gate-form input{
    width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);
    color:var(--text);font:inherit;font-size:15px;letter-spacing:.28em;text-align:center;padding:0 14px;
  }
  .gate-form input:focus{outline:0;border-color:var(--accent);background:var(--card)}
  .gate-form .btn{height:44px;justify-content:center;font-size:14px;border-radius:12px}
  .gate-err{min-height:17px;font-size:12.5px;color:var(--danger);margin-top:2px}
  .gate-meta{margin-top:16px;font-size:11.5px;color:var(--faint);line-height:1.6}
  .gate-meta code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
  .gate-link{
    margin-top:12px;border:0;background:none;color:var(--sub);font:inherit;font-size:12px;
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;
  }
  .gate-link:hover{color:var(--text)}
  .spin{
    width:27px;height:27px;margin:20px auto 14px;border-radius:50%;
    border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- 主设备：待审批红点 ---- */
  .ibtn.dot{position:relative}
  .ibtn.dot:after{
    content:'';position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;
    background:var(--danger);box-shadow:0 0 0 2px var(--card);
  }

  /* ---- 设备授权管理 ---- */
  .dev-sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
  .dev-head{
    display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;
    letter-spacing:.3px;color:var(--sub);text-transform:uppercase;margin-bottom:2px;
  }
  .dev-head .tag{
    font-size:10.5px;font-weight:600;letter-spacing:0;text-transform:none;
    padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);
  }
  .dev-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .dev-row:last-child{border-bottom:0}
  .dev-row:first-of-type{padding-top:6px}
  .dev-ava{
    width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
    font-size:11.5px;font-weight:650;color:#fff;
  }
  .dev-txt{flex:1;min-width:0}
  .dev-name{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dev-sub{font-size:11.5px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dev-acts{display:flex;gap:6px;flex:none}
  .mini{
    height:27px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--card-2);
    color:var(--sub);font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;
  }
  .mini:hover{color:var(--text);border-color:var(--faint)}
  .mini.ok{background:var(--accent);border-color:var(--accent);color:#fff}
  .mini.ok:hover{filter:brightness(1.06);color:#fff}
  .mini.bad:hover{color:var(--danger);border-color:var(--danger)}
  .dev-empty{font-size:12px;color:var(--faint);padding:9px 0}
  .dev-hint{font-size:11.5px;color:var(--faint);line-height:1.6;margin-top:8px}

  /* ---- 二维码 ---- */
  .qr-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:16px}
  .qr-box{
    width:228px;height:228px;padding:9px;border-radius:15px;background:#fff;
    border:1px solid var(--line);box-shadow:0 10px 28px -20px rgba(16,24,40,.5);
  }
  .qr-box img{width:100%;height:100%;display:block;border-radius:6px}
  .qr-url{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--sub);
    word-break:break-all;text-align:center;line-height:1.55;
  }
  .qr-ips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .qr-ip{
    height:26px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:var(--card-2);
    color:var(--sub);font:inherit;font-size:11.5px;cursor:pointer;
  }
  .qr-ip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .qr-tip{font-size:11.5px;color:var(--faint);text-align:center;line-height:1.65;max-width:280px}

  /* ---- 输入区：文字块 / 附件块，可任意交替 ---- */
  .blocks{display:flex;flex-direction:column;gap:1px;min-height:38px}
  .blk-tx{
    width:100%;min-height:26px;max-height:40vh;resize:none;border:0;outline:0;overflow-y:auto;
    background:transparent;color:var(--text);font:inherit;line-height:1.62;padding:5px 6px;display:block;
  }
  .blk-tx::placeholder{color:var(--faint)}
  .blk-tx:disabled{cursor:not-allowed;opacity:.75}
  .blk-md{
    display:flex;align-items:center;gap:9px;margin:3px 0;padding:6px 7px;border-radius:11px;
    background:var(--card-2);border:1px solid var(--line);
  }
  .blk-thumb{width:36px;height:36px;flex:none;border-radius:8px;object-fit:cover;display:block;background:var(--line-soft)}
  .blk-ico{
    width:36px;height:36px;flex:none;border-radius:8px;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent);font-size:9.5px;font-weight:800;
    letter-spacing:.3px;text-transform:uppercase;
  }
  .blk-info{flex:1;min-width:0}
  .blk-nm{font-size:12.8px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .blk-sz{font-size:11px;color:var(--faint);margin-top:1px;font-variant-numeric:tabular-nums}
  .blk-pg{height:3px;border-radius:99px;background:var(--line-soft);overflow:hidden;margin-top:5px}
  .blk-pg i{display:block;height:100%;width:0;background:var(--accent);transition:width .18s}
  .blk-x{
    width:28px;height:28px;flex:none;padding:0;border:0;border-radius:8px;background:transparent;
    color:var(--faint);cursor:pointer;display:grid;place-items:center;font-size:15px;line-height:1;
  }
  .blk-x:hover{background:var(--line);color:var(--danger)}
  .blk-md.bad{border-color:var(--danger)}
  .blk-md.bad .blk-sz{color:var(--danger)}

  /* ---- 输入区工具条：表情 / 分隔符 / Markdown 快捷 ---- */
  .mtools-wrap{display:flex;align-items:center;gap:4px;margin-top:6px}
  .mtools{flex:1;min-width:0;display:flex;align-items:center;gap:3px;overflow-x:auto;scrollbar-width:none}
  .mtools::-webkit-scrollbar{display:none}
  .composer.prev-on .mtools{display:none}
  .pvbtn{flex:none;margin-left:auto}
  .tool{
    flex:none;height:27px;padding:0 8px;border:1px solid transparent;border-radius:8px;background:transparent;
    color:var(--sub);font:inherit;font-size:12.2px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;
    white-space:nowrap;transition:.14s;
  }
  .tool:hover{background:var(--card-2);color:var(--text)}
  .tool.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(76,110,245,.3)}
  .tool i{font-style:normal;font-weight:800;font-size:11.5px;letter-spacing:.2px}
  .tool.mono i{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px}
  .tool.emoji span{font-size:15px;line-height:1}

  .emoji-pop{
    position:fixed;z-index:160;width:min(330px,92vw);background:var(--card);border:1px solid var(--line);
    border-radius:14px;box-shadow:0 20px 48px -14px rgba(16,24,40,.42);padding:8px;display:none;
  }
  .emoji-pop.on{display:block;animation:tin .16s ease}
  .emoji-tabs{display:flex;gap:2px;margin-bottom:6px}
  .emoji-tab{
    height:24px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--faint);
    font:inherit;font-size:11.5px;cursor:pointer;
  }
  .emoji-tab.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
  .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;max-height:176px;overflow-y:auto}
  .emoji-grid button{
    height:31px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-size:19px;
    line-height:1;display:grid;place-items:center;padding:0;
  }
  .emoji-grid button:hover{background:var(--card-2)}
  @media (max-width:520px){
    /* 手机上表情面板改成底部抽屉，别盖住输入框 */
    .emoji-pop{
      left:0!important;right:0;top:auto!important;bottom:0;width:auto;border-radius:16px 16px 0 0;
      padding:10px 10px calc(10px + env(safe-area-inset-bottom));
      box-shadow:0 -12px 40px -12px rgba(16,24,40,.45);
    }
    .emoji-pop.on{animation:sheetUp .22s cubic-bezier(.2,.8,.3,1)}
    .emoji-grid{grid-template-columns:repeat(8,1fr);max-height:36vh}
    .mtools{
      -webkit-mask-image:linear-gradient(to right,#000 90%,rgba(0,0,0,.2));
      mask-image:linear-gradient(to right,#000 90%,rgba(0,0,0,.2));
    }
  }
  @keyframes sheetUp{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}

  /* ---- 输入区预览模式 ---- */
  .mdp{display:none;padding:2px 4px 0;min-height:44px}
  .composer.prev-on .blocks{display:none}
  .composer.prev-on .mdp{display:block}
  .mdp-empty{color:var(--faint);font-size:13px;padding:8px 2px}
  .mdp-atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .mdp-att{
    display:inline-flex;align-items:center;gap:6px;max-width:100%;height:26px;padding:0 9px;
    border-radius:8px;background:var(--card-2);border:1px solid var(--line);font-size:12px;color:var(--sub);
  }
  .mdp-att b{font-weight:650;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
  .mdp-att i{font-style:normal;font-size:11px;color:var(--faint)}
  .tool:disabled{opacity:.38;cursor:not-allowed}

  /* ---- 卡片里的图文混排 ---- */
  .shots{display:grid;gap:6px;margin-top:9px}
  .shots.n1{grid-template-columns:1fr}
  .shots.n2{grid-template-columns:1fr 1fr}
  .shots.n3{grid-template-columns:repeat(3,1fr)}
  .shots .thumb{width:100%;height:100%;object-fit:cover;border-radius:10px;min-height:0}
  .shots.n1 .thumb{width:auto;max-width:100%;height:auto;max-height:320px;justify-self:start;object-fit:fill}
  .shots.n2 .thumb,.shots.n3 .thumb{aspect-ratio:1/1;max-height:none}
  .card > .text-body + .text-body{margin-top:10px}
  .card > .shots + .text-body,.card > .shots + .file{margin-top:10px}
  .card > .file{margin-top:10px}
  .img-broken{font-size:12px;color:var(--faint);padding:10px 2px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="mark"><img src="/logo.gif" alt="XiaoMao"></div>
    <div class="headtext">
      <div class="title"><span class="brand">XiaoMao</span> 互传</div>
      <div class="addr" id="addr">连接中…</div>
    </div>
    <div class="spacer"></div>
    <button class="chip" id="who" title="点击修改本机名称">
      <span class="dot"></span><b id="whoName">…</b>
    </button>
    <button class="ibtn" id="themeBtn" title="切换主题" aria-label="切换主题"></button>
    <button class="ibtn" id="qrBtn" title="生成扫码访问二维码" aria-label="生成二维码" hidden></button>
    <button class="ibtn" id="settingsBtn" title="主设备设置" aria-label="主设备设置" hidden></button>
  </div>
</header>

<div class="composer-bar" id="composerBar">
  <div class="composer-wrap">
    <section class="composer" id="composer">
      <div class="blocks" id="blocks"></div>
      <div class="mdp" id="mdp"></div>
      <div class="mtools-wrap" id="mtoolsWrap">
        <div class="mtools" id="mtools">
          <button type="button" class="tool emoji" data-tool="emoji" title="插入表情"><span>😊</span></button>
          <button type="button" class="tool" data-tool="hr" title="插入分隔符">— 分隔</button>
          <button type="button" class="tool" data-tool="h" title="标题"><i>H</i></button>
          <button type="button" class="tool" data-tool="bold" title="加粗"><i>B</i></button>
          <button type="button" class="tool" data-tool="italic" title="斜体"><i style="font-style:italic">I</i></button>
          <button type="button" class="tool mono" data-tool="code" title="行内代码"><i>&lt;/&gt;</i></button>
          <button type="button" class="tool mono" data-tool="block" title="代码块"><i>{ }</i></button>
          <button type="button" class="tool" data-tool="quote" title="引用">❝</button>
          <button type="button" class="tool" data-tool="list" title="列表">• 列表</button>
          <button type="button" class="tool" data-tool="link" title="链接">🔗 链接</button>
        </div>
        <button type="button" class="tool pvbtn" data-tool="preview" id="previewBtn" title="预览 Markdown 效果">预览</button>
      </div>
      <div class="bar">
        <button class="to-chip" id="toBtn" title="选择发送对象">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-4.5 7-10V6l-7-3-7 3v5c0 5.5 7 10 7 10z"/></svg>
          <span id="toName">所有人</span>
        </button>
        <button class="btn ghost" id="pick">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          <span class="pick-label">文件 / 图片</span>
        </button>
        <input type="file" id="file" multiple hidden>
        <span class="hint" id="hint">拖拽文件到页面 · 可直接粘贴截图</span>
        <button class="btn primary" id="send" disabled>发送</button>
      </div>
      <div class="locked" id="locked" hidden></div>
    </section>
  </div>
</div>

<main class="wrap">
  <section class="peers">
    <div class="peers-head">
      <span>在线设备</span><span class="count-pill" id="peerCount">0</span>
    </div>
    <div class="peer-row" id="peerRow"></div>
  </section>

  <div class="toolbar">
    <span class="count" id="count">载入中…</span>
    <div class="spacer"></div>
    <button class="link" id="clear" hidden>清空全部</button>
  </div>

  <section class="feed" id="feed"></section>
</main>

<footer class="foot">
  <b>XiaoMao</b><span class="sep">·</span><span>局域网互传</span>
</footer>

<div class="drop" id="drop"><div class="drop-in">松开即可发送</div></div>
<div class="lightbox" id="lb">
