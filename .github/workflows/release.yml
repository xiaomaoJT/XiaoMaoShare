name: 四端发布

# 用法：打一个 v 开头的 tag 推上来，自动出 mac dmg + win exe + android apk 并创建 GitHub Release
#   git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------- 桌面端：mac runner 一台机器同时出 dmg 和 exe ----------
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm ci

      - name: 打包 Windows（安装版 nsis + 自解压便携版 SFX）
        # 先出这两类，此时 win-unpacked 里还没有 portable.mode 标记，
        # 保证 nsis 安装包不会把数据误写到 Programs 目录
        run: npm run dist -- --win=nsis,portable --publish never

      - name: 打包 Windows 解压即用便携版（避免 SFX 每次重解压约 8 秒）
        # 在 win-unpacked 根目录放一个 portable.mode 标记，再压成 zip；
        # 标记只进 zip，不进上面的 nsis 安装包
        run: |
          VER=$(node -p "require('./package.json').version")
          cd release
          touch win-unpacked/portable.mode
          zip -r "XiaoMaoShare-${VER}-win-portable.zip" win-unpacked
          cd ..

      - name: 打包 macOS（dmg + 自动更新 zip）
        run: npm run dist -- --mac --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          if-no-files-found: error
          # exe/dmg/zip 给人下载；blockmap 供 Windows 差量更新；
          # latest*.yml 是 electron-updater 的版本元数据，缺了自动更新就瞎了
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  # ---------- Android：ubuntu runner 自带 Android SDK，出 debug 签名 apk（可直接安装） ----------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: 打包 apk（debug 签名，自用免上架）
        run: gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/*.apk

  # ---------- 汇总发布 ----------
  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: rel

      - uses: actions/download-artifact@v4
        with:
          name: android
          path: rel

      - name: apk 改成带版本号的正式名字
        run: mv rel/*-debug.apk "rel/XiaoMaoShare-${{ github.ref_name }}-android.apk"

      - name: 提取 CHANGELOG 最上面一节做发布说明
        run: awk '/^## \[/{n++} n==1' CHANGELOG.md > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: rel/*
          body_path: notes.md
