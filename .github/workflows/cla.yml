name: CLA Assistant

# 贡献者许可协议自动签署流程
#
# 首次提交 PR 时自动在 PR 下留言提示签署；
# 贡献者回复指定语句后，签名写入 cla-signatures 分支的 signatures/version1/cla.json。
#
# 使用前提：
#   1. 仓库需存在分支 cla-signatures（建议设为无保护的空分支，只用于存签名记录）。
#      若首次运行报 "branch not found"，手动创建该分支后重新跑一次。
#   2. Settings → Actions → General → Workflow permissions 选择 "Read and write permissions"。
#   3. 来自 fork 的 PR 若提示无权限写入，需在仓库 Secrets 中添加 PERSONAL_ACCESS_TOKEN
#      （fine-grained token，勾选本仓库的 Contents: Read and write + Pull requests: Read and write + Metadata: Read）。

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/xiaomaoJT/XiaoMaoShare/blob/main/CLA.md'
          branch: 'cla-signatures'
          # 维护者本人无需签署
          allowlist: xiaomaoJT,bot*
          create-file-commit-message: 'chore: 创建 CLA 签名记录文件'
          signed-commit-message: 'chore: $contributorName 已签署 CLA'
          custom-notsigned-prcomment: >
            感谢提交 PR。合并前需要先签署[贡献者许可协议（CLA）](https://github.com/xiaomaoJT/XiaoMaoShare/blob/main/CLA.md)，
            这是为了保留项目将来调整许可条款（包括提供商业许可）的可能性。签署只需一次，对该账号后续所有贡献长期有效。
            在下方回复这句话即可完成签署：
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: '所有贡献者均已签署 CLA，可以合并。'
