plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xiaomao.share'
    compileSdk 34

    defaultConfig {
        applicationId 'com.xiaomao.share'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '2.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 零第三方依赖：只用 Android SDK 自带类，无需下载任何库
