<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>XiaoMao 互传 · 悬浮球</title>
<style>
  :root {
    --disc: 64px;                    /* 球体直径，主进程按设置推过来 */
    --card: #ffffff;
    --line: #e3e8f0;
    --ink: #14171c;
    --ink2: #5a6473;
    --ink3: #8a94a6;
    --accent: #4c6ef5;
    --accent-soft: #eef2ff;
    --ok: #12b886;
    --err: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: transparent;         /* 窗口本身是透明的，只有球和面板有实体 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    user-select: none;
    overflow: hidden;
    color: var(--ink);
  }

  /* ---------------- 球 ---------------- */
  #ball {
    position: absolute; left: 0; top: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: default;
    touch-action: none;
  }
  #ball .disc {
    width: var(--disc); height: var(--disc); border-radius: 50%;
    background: #fff;
    box-shadow: 0 4px 14px -4px rgba(16, 24, 40, .45), 0 0 0 1px rgba(20, 23, 28, .07);
    overflow: hidden;
    position: relative;
    transition: transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .16s;
  }
  #ball:hover .disc { transform: scale(1.05); box-shadow: 0 6px 18px -6px rgba(16, 24, 40, .55), 0 0 0 1px rgba(20, 23, 28, .09); }
  #ball.dragging .disc { transform: scale(.94); }
  #ball img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }

  /* 未读角标：比球更靠外一点，不然被圆边吃掉 */
  #badge {
    position: absolute; top: 4px; right: 4px;
    min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 10px; background: var(--err);
    color: #fff; font-size: 11.5px; font-weight: 700; line-height: 20px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(192, 57, 43, .45);
  }
  #badge[hidden] { display: none; }

  /* 投放高亮：拖动文件悬停时整颗球亮起来 */
  #ball.drop .disc { transform: scale(1.08); box-shadow: 0 0 0 3px var(--accent), 0 12px 30px -8px rgba(76, 110, 245, .6); }
  #ball.drop .disc::after {
    content: '松手发送';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(76, 110, 245, .86); color: #fff;
    font-size: 12px; font-weight: 700;
  }

  /* ---------------- 面板 ---------------- */
  #panel {
    position: absolute;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 24px 60px -22px rgba(16, 24, 40, .55);
    display: flex; flex-direction: column;
    overflow: hidden;
    animation: pop .14s ease-out;
  }
  #panel[hidden] { display: none; }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

  /* 顶栏就是这块浮件的「标题栏」：按住这里能拖动整个窗口 */
  .p-head {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 14px 9px; border-bottom: 1px solid var(--line);
    cursor: default; touch-action: none;
  }
  .p-head:active { cursor: default; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink3); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(18, 184, 134, .16); }
  .p-title { font-size: 12.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 小三角 = 「这里能点」：点它换发送目标 */
  .p-caret { width: 13px; height: 13px; flex: none; color: var(--ink3); margin-left: -3px; }
  .p-head:hover .p-caret { color: var(--accent); }
  .p-head:hover .p-title { color: var(--accent); }
  .p-sub { margin-left: auto; font-size: 11.5px; color: var(--ink3); white-space: nowrap; flex: none; }

  .p-list { flex: 1; overflow-y: auto; padding: 6px; }
  .p-list::-webkit-scrollbar { width: 8px; }
  .p-list::-webkit-scrollbar-thumb { background: #dfe5ef; border-radius: 4px; border: 2px solid #fff; }

  .row {
    display: flex; gap: 9px; align-items: flex-start;
    padding: 8px 9px; border-radius: 10px;
  }
  .row:hover { background: #f6f8fc; }
  .row + .row { margin-top: 1px; }

  /* 类型头像：颜色由 data-k 决定，跟主界面同一套分类（public/filetype.js） */
  .row .ico {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 9.5px; font-weight: 800; letter-spacing: .2px;
    background: color-mix(in srgb, var(--k, #5a6473) 14%, #fff);
    color: var(--k, #5a6473);
    overflow: hidden;
  }
  .row .ico img { width: 100%; height: 100%; object-fit: cover; display: block; }
  [data-k]{--k:#5a6473}
  [data-k="img"]{--k:#e8590c}
  [data-k="video"]{--k:#7048e8}
  [data-k="audio"]{--k:#d6336c}
  [data-k="pdf"]{--k:#e03131}
  [data-k="doc"]{--k:#1c7ed6}
  [data-k="sheet"]{--k:#2f9e44}
  [data-k="slide"]{--k:#f08c00}
  [data-k="zip"]{--k:#8c6d1f}
  [data-k="code"]{--k:#0c8599}
  [data-k="text"]{--k:#868e96}
  [data-k="app"]{--k:#495057}
  [data-k="other"]{--k:#7a8699}

  .row .body { min-width: 0; flex: 1; }
  .row .t1 {
    font-size: 12.5px; line-height: 1.5; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    word-break: break-word;
  }
  .row .t2 { font-size: 11px; color: var(--ink3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 组成摘要（文字 + 2 个文件）单独一行：挤在时间后面会被省略号吃掉 */
  .row .t3 { font-size: 10.5px; color: var(--ink3); margin-top: 3px; display: inline-block; padding: 1px 6px; border-radius: 6px; background: #f2f5fa; }
  .row .acts { display: flex; gap: 4px; flex: none; align-self: center; }
  .row .act {
    height: 24px; padding: 0 8px; border-radius: 7px;
    border: 1px solid var(--line); background: #fff;
    font: inherit; font-size: 11px; font-weight: 600; color: var(--ink2);
    cursor: default; white-space: nowrap;
  }
  .row .act:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .row .act:disabled { color: #b9c0cc; border-color: #eef1f6; background: #fafbfd; }
  .row .act[hidden] { display: none; }

  .empty { padding: 30px 18px; text-align: center; font-size: 12.5px; color: var(--ink3); line-height: 1.8; }

  .p-foot { padding: 9px 10px 10px; border-top: 1px solid var(--line); }
  .composer { display: flex; gap: 7px; align-items: flex-end; }
  .composer textarea {
    flex: 1; min-width: 0; resize: none; max-height: 84px;
    padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: #fff;
    font: inherit; font-size: 12.5px; line-height: 1.5; color: var(--ink);
    outline: none; user-select: text;
  }
  .composer textarea:focus { border-color: #b9c8ea; box-shadow: 0 0 0 3px rgba(76, 110, 245, .1); }
  .composer textarea::placeholder { color: var(--ink3); }
  .send {
    height: 34px; padding: 0 14px; flex: none;
    border-radius: 9px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff;
    font: inherit; font-size: 12.5px; font-weight: 650; cursor: default;
  }
  .send:hover { filter: brightness(1.06); }
  .send:disabled { opacity: .45; filter: none; }

  .hint { font-size: 11px; color: var(--ink3); margin-top: 6px; display: flex; align-items: center; gap: 8px; }
  .hint .grow { flex: 1; }
  .link {
    border: 0; background: none; padding: 0; font: inherit; font-size: 11px;
    color: var(--ink3); cursor: default;
  }
  .link:hover { color: var(--accent); }

  /* 拖文件的遮罩：铺满整个窗口，落在球和面板上都算。
     pointer-events:none —— 遮罩自己不参与拖拽事件流，不然它一出现就把光标底下的
     事件目标换了一遍，Windows 上会打乱 dragenter/leave 的次序，drop 反而不来。 */
  #dropmask {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    display: none; align-items: center; justify-content: center;
    background: rgba(76, 110, 245, .08);
    border: 2px dashed var(--accent); border-radius: 18px;
    color: var(--accent); font-size: 13px; font-weight: 700;
  }
  body.dropping #dropmask { display: flex; }

  .toast {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    background: rgba(20, 23, 28, .9); color: #fff;
    font-size: 12px; padding: 7px 12px; border-radius: 9px;
    opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 30;
    white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
  <div id="ball" title="点一下展开；拖文件进来直接发送（⌘/Ctrl + 滚轮调大小）">
    <div class="disc"><img id="logo" alt=""></div>
    <span id="badge" hidden>0</span>
  </div>

  <div id="panel" hidden>
    <div class="p-head" id="pHead" title="按住可以拖动；点一下切换发给谁">
      <span class="dot" id="dot"></span>
      <span class="p-title" id="pTitle">XiaoMao 互传</span>
      <svg class="p-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      <span class="p-sub" id="pSub"></span>
    </div>
    <div class="p-list" id="pList"></div>
    <div class="p-foot">
      <div class="composer">
        <textarea id="txt" rows="1" placeholder="说点什么，回车发送"></textarea>
        <button class="send" id="btnSend" type="button">发送</button>
      </div>
      <div class="hint">
        <span class="grow" id="hintText">把文件拖到球上松手即发</span>
        <button class="link" id="btnCollapse" type="button" title="面板收起，球还在">收起面板</button>
        <button class="link" id="btnHide" type="button" title="球整个关掉；下次从菜单「悬浮球 → 显示悬浮球」再打开">关闭悬浮球</button>
        <button class="link" id="btnHost" type="button">打开主界面</button>
      </div>
    </div>
  </div>

  <div id="dropmask">松开就发送</div>
  <div class="toast" id="toast"></div>

<script src="../public/filetype.js"></script>
<script>
(function () {
  var api = window.xmBall || {};
  var $ = function (id) { return document.getElementById(id); };
  var ball = $('ball');
  var panel = $('panel');
  var badge = $('badge');
  var listEl = $('pList');
  var toastEl = $('toast');
  var txt = $('txt');
  var btnSend = $('btnSend');
  var open = false;
  var lastSeen = Number(sessionStorage.getItem('ballSeen') || 0);
  var pollTimer = null;
  var sending = false;

  $('logo').src = '../public/icon.png';

  function toast(msg) {
    if (!msg) return;
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('on'); }, 2000);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function ago(t) {
    var s = Math.max(0, Math.floor((Date.now() - t) / 1000));
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    return Math.floor(s / 86400) + ' 天前';
  }

  /* ---------------- 几何：主进程算好，这里只负责摆 ---------------- */
  function applyGeo(r) {
    if (!r) return;
    if (r.size) document.documentElement.style.setProperty('--disc', r.size + 'px');
    var b = r.ball || { left: 0, top: 0 };
    var box = r.box || (r.size ? r.size + 20 : 84);
    ball.style.left = b.left + 'px';
    ball.style.top = b.top + 'px';
    ball.style.width = box + 'px';
    ball.style.height = box + 'px';
    if (r.panel) {
      panel.hidden = false;
      panel.style.left = r.panel.left + 'px';
      panel.style.top = r.panel.top + 'px';
      panel.style.width = r.panel.width + 'px';
      panel.style.height = r.panel.height + 'px';
    } else {
      panel.hidden = true;
    }
  }

  async function setOpen(on) {
    if (on === open) return;
    open = on;
    var r = await api.expand(on);
    applyGeo(r || {});
    if (on) {
      if (api.seen) api.seen();   // 打开就算看过了，角标立刻清
      badge.hidden = true;
    }
    startPoll();                  // 展开时刷得勤一点，收起时省电
  }

  /* ---------------- 拖动：球和面板标题栏都能拖 ---------------- */
  function makeDraggable(el, onClick) {
    var drag = null;
    el.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      // 面板里的输入框 / 按钮不参与拖动
      if (e.target.closest && e.target.closest('button, textarea, input')) return;
      drag = { sx: e.screenX, sy: e.screenY, lx: e.screenX, ly: e.screenY, moved: false };
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* 老内核 */ }
    });
    el.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dx = e.screenX - drag.lx;
      var dy = e.screenY - drag.ly;
      if (!drag.moved) {
        if (Math.hypot(e.screenX - drag.sx, e.screenY - drag.sy) < 4) return;
        drag.moved = true;
        el.classList.add('dragging');
      }
      drag.lx = e.screenX;
      drag.ly = e.screenY;
      api.move(dx, dy);          // 展开时挪的是整个窗口，球和面板一起走
    });
    el.addEventListener('pointerup', function (e) {
      if (!drag) return;
      var moved = drag.moved;
      drag = null;
      el.classList.remove('dragging');
      try { el.releasePointerCapture(e.pointerId); } catch (err) { /* 同上 */ }
      if (moved) { api.dragEnd(); return; }
      if (onClick) onClick();
    });
  }

  makeDraggable(ball, function () { setOpen(!open); });
  // 标题栏也能拖；「点一下」= 换发送目标（本机 / 连到哪台）
  makeDraggable($('pHead'), function () { if (api.pickTarget) api.pickTarget(); });

  /* 球上 ⌘/Ctrl + 滚轮换大小：比翻菜单快。
     必须带修饰键 —— 球的窗口永远置顶，光标扫过它时随手一滑就改尺寸太容易误触。 */
  var wheelAt = 0;
  ball.addEventListener('wheel', function (e) {
    if (!(e.metaKey || e.ctrlKey)) return;   // 不带修饰键就当没有，别吃掉页面滚动
    e.preventDefault();
    var now = Date.now();
    if (now - wheelAt < 180) return;         // 触控板会连发一大串，节流一下
    wheelAt = now;
    if (api.sizeStep) api.sizeStep(e.deltaY > 0 ? 1 : -1).then(function (r) {
      if (r && r.ok) toast('球的大小：' + ({ sm: '小', md: '标准', lg: '大' }[r.size] || r.size));
    });
  }, { passive: false });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && open) setOpen(false);
  });

  /* ---------------- 列表 ---------------- */
  function paint(state) {
    if (!state) return;
    var host = state.target && state.target.kind === 'host';
    $('dot').className = 'dot' + (state.online ? ' on' : '');
    $('pTitle').textContent = host ? '本机主机' : (state.target && state.target.label) || 'XiaoMao 互传';
    // 本机是「可被连接」，连别人是「发到对方」——两种身份的说法不一样
    $('pSub').textContent = state.online
      ? (host ? ('可被连接 · ' + (state.port || '')) : '内容会发到对方')
      : (state.note || '未连接');

    var items = state.items || [];
    var n = state.unread || 0;
    badge.hidden = !n;
    badge.textContent = n > 99 ? '99+' : String(n);

    if (!items.length) {
      listEl.innerHTML = '<div class="empty">还没有内容<br>说句话，或把文件拖到球上</div>';
      return;
    }

    listEl.innerHTML = items.map(function (it) {
      var tk = it.tk || { key: 'other', label: 'FILE' };
      var meta = (it.from ? '来自 ' + it.from + ' · ' : '') + ago(it.time || Date.now());
      var isText = it.kind === 'text';
      return '<div class="row" data-id="' + esc(it.id || '') +
          '" data-kind="' + esc(it.kind || '') +
          '" data-name="' + esc(it.name || '') +
          '" data-file="' + esc(it.file || '') +
          '" data-fid="' + esc(it.fid || '') +
          '" data-text="' + esc(isText ? (it.snippet || '') : '') + '">' +
        '<div class="ico" data-k="' + esc(tk.key) + '">' + esc(tk.label) + '</div>' +
        '<div class="body">' +
          '<div class="t1">' + esc(it.title || '') + '</div>' +
          '<div class="t2">' + esc(meta) + '</div>' +
          (it.comp ? '<div class="t3">' + esc(it.comp) + '</div>' : '') +
        '</div>' +
        '<div class="acts">' +
          '<button class="act" type="button" data-act="locate" title="打开主界面，定位到这条">定位</button>' +
          (isText ? '' :
            '<button class="act" type="button" data-act="reveal"' + (it.canReveal ? '' : ' disabled') +
              ' title="' + (it.canReveal ? '在文件夹里显示这份文件' : '本机还没有这份文件，先下载') + '">位置</button>') +
        '</div>' +
        '</div>';
    }).join('');
  }

  listEl.addEventListener('click', async function (e) {
    var btn = e.target.closest('.act');
    var row = e.target.closest('.row');
    if (!row) return;
    var id = row.getAttribute('data-id');
    var act = btn ? btn.getAttribute('data-act') : '';

    // 「位置」：打开文件所在文件夹（本机真有这份文件时才出现）
    if (act === 'reveal') {
      var r = await api.reveal({
        id: id,
        name: row.getAttribute('data-name'),
        file: row.getAttribute('data-file'),
        fid: row.getAttribute('data-fid'),
      });
      if (!r || !r.ok) toast((r && r.error) || '打不开文件位置');
      return;
    }

    // 文字行的正文点一下就是复制（这类行没有第二个按钮，正文就是内容本身）
    var text = row.getAttribute('data-text');
    if (!btn && text) {
      api.copy(text);
      toast('已复制');
      return;
    }

    // 「定位」：打开主界面，滚到这条并闪一下
    var loc = await api.locate(id);
    if (!loc || !loc.ok) toast((loc && loc.error) || '定位失败');
    else setOpen(false);
  });

  async function poll() {
    try {
      var st = await api.list();
      if (st && st.ok) {
        // 未读只在你没看的时候累加；面板开着就当看过了
        if (open) {
          var newest = (st.items || []).reduce(function (m, it) { return Math.max(m, it.time || 0); }, 0);
          if (newest > lastSeen) {
            lastSeen = newest;
            sessionStorage.setItem('ballSeen', String(lastSeen));
          }
          st.unread = 0;
        }
        paint(st);
      } else {
        paint({ online: false, note: (st && st.error) || '未连接', items: [] });
      }
    } catch (err) { /* 断网 / 服务停了：保持上一次的样子，别抖 */ }
  }

  function startPoll() {
    clearInterval(pollTimer);
    pollTimer = setInterval(poll, open ? 3000 : 5000);
    poll();
  }

  /* 发送目标变了（手动切换 / 连上或断开别人）→ 立刻重画标题，不等下一轮轮询 */
  if (api.onTargetChanged) api.onTargetChanged(function () { poll(); });

  /* ---------------- 拖文件 ---------------- */
  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) {
    e.preventDefault();
    dragDepth++;
    document.body.classList.add('dropping');
  });
  // dragover 在 document 上也拦一道：这是 Electron 的老经验，少这道 Windows 上 drop 可能不触发
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('dragleave', function (e) {
    e.preventDefault();
    if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dropping'); }
  });
  window.addEventListener('drop', async function (e) {
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove('dropping');
    try {
      var files = e.dataTransfer && e.dataTransfer.files;
      // FileList 这种宿主对象过不了 contextBridge（过去会变成空对象，for...of 直接炸），
      // 单个 File 可以过——先在页面这边摊成数组再交给 preload 取路径
      var paths = api.pathsOf ? api.pathsOf(Array.prototype.slice.call(files || [])) : [];
      // 拿不到路径多半是从微信 / 浏览器这类地方拖的——那些「文件」本机并不存在
      if (!paths.length) return toast(files && files.length ? '拿不到文件路径，请从「访达 / 资源管理器」或桌面拖入' : '只支持拖本机的文件');
      toast('正在发送 ' + paths.length + ' 个文件…');
      var r = await api.send({ paths: paths });
      if (r && r.ok) {
        // 部分失败要把原因念出来：文件不存在 / 对方拒收，别让人对着「发送失败」干瞪眼
        toast(r.failed ? ('已发送 ' + r.sent + ' 个，失败：' + (r.failedNames || []).join('；')) : ('已发送 ' + r.sent + ' 个'));
        poll();
      } else toast((r && r.error) || '发送失败');
    } catch (err) {
      toast('拖放发送出错：' + ((err && err.message) || err));
    }
  });

  /* 链路上任何一步悄悄挂掉都要出声——不然对着「没反应」排查是无底洞 */
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    toast('出错：' + ((r && (r.message || r.error)) || r));
  });
  window.addEventListener('error', function (e) {
    toast('出错：' + ((e && e.message) || '脚本错误'));
  });

  /* ---------------- 发文字 ---------------- */
  function autoGrow() {
    txt.style.height = 'auto';
    txt.style.height = Math.min(84, Math.max(34, txt.scrollHeight)) + 'px';
  }

  async function sendText() {
    var body = txt.value.trim();
    if (!body || sending) return;
    sending = true;
    btnSend.disabled = true;
    try {
      var r = await api.send({ text: body });
      if (r && r.ok) {
        txt.value = '';
        autoGrow();
        toast('已发送');
        poll();
      } else {
        toast((r && r.error) || '发送失败');
      }
    } finally {
      sending = false;
      btnSend.disabled = false;
      txt.focus();
    }
  }

  txt.addEventListener('input', autoGrow);
  txt.addEventListener('keydown', function (e) {
    // 回车发送、Shift+回车换行：这是个小面板，不是文档编辑器
    if (e.key === 'Enter' && !e.shiftKey && !e.altKey) {
      e.preventDefault();
      sendText();
    }
  });
  btnSend.addEventListener('click', sendText);

  /* ---------------- 按钮 ---------------- */
  $('btnHost').addEventListener('click', function () { api.openHost(); });
  // 「收起」只收面板，球留在原地；关球是另一回事，别混在一个词里
  $('btnCollapse').addEventListener('click', function () { setOpen(false); });
  $('btnHide').addEventListener('click', function () { api.hide(); });

  if (api.onGeometry) api.onGeometry(applyGeo);

  if (api.layout) api.layout().then(applyGeo).catch(function () {});
  startPoll();
})();
</script>
</body>
</html>
