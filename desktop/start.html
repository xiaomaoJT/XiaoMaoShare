<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XiaoMao 互传</title>
<style>
  :root {
    --bg: #f2f4f7;
    --card: #ffffff;
    --line: #e3e8f0;
    --ink: #14171c;
    --ink2: #5a6473;
    --ink3: #8a94a6;
    --accent: #4c6ef5;
    --accent-soft: #eef2ff;
    --warm: #e8562f;
    --err: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    user-select: none;
    overflow: hidden;
  }

  /* 顶部一条透明拖拽区：无边框窗口也能拖动（压在选择页之上，不然会被内容盖住） */
  #drag { position: fixed; inset: 0 0 auto 0; height: 46px; z-index: 10; -webkit-app-region: drag; }
  html[data-platform="darwin"] #drag { height: 62px; }

  .center { height: 100%; display: flex; align-items: center; justify-content: center; padding: 28px; }

  /* ---------------- 启动动画（默认就是它，避免先亮一下再跳） ---------------- */
  #boot { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  #boot[hidden] { display: none; }
  /* 应用图标（构建用的是同一张，见 build/icon.png）本身就是白底方图，
     所以按「一枚 app 图标」来摆：圆角裁切 + 一圈极淡的描边，避免白底糊在浅灰背景上 */
  .mark {
    width: 72px; height: 72px; border-radius: 17px;
    object-fit: cover; background: #fff;
    box-shadow: 0 8px 22px -12px rgba(20,23,28,.5), 0 0 0 1px rgba(20,23,28,.07);
  }
  .brand { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  .spin {
    width: 24px; height: 24px; border-radius: 50%;
    border: 3px solid #d7dded; border-top-color: var(--accent);
    animation: sp .8s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  .boot-tip { font-size: 13px; color: var(--ink2); }

  /* ---------------- 选择页 ---------------- */
  #pick { width: 100%; max-width: 880px; }
  #pick[hidden] { display: none; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .head .mark { width: 38px; height: 38px; border-radius: 10px; box-shadow: 0 4px 12px -7px rgba(20,23,28,.5), 0 0 0 1px rgba(20,23,28,.07); }
  .head .brand { font-size: 15px; }
  h1 { font-size: 21px; margin: 18px 0 4px; letter-spacing: .3px; }
  .sub { font-size: 13px; color: var(--ink2); margin: 0 0 20px; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .cards { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    display: flex; flex-direction: column;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .card:hover { border-color: #c8d3ea; }
  .card.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .card .t { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .card .d { font-size: 12.5px; color: var(--ink2); line-height: 1.65; margin: 6px 0 0; }
  .card .note { display: block; font-size: 11.5px; color: var(--ink3); margin-top: 6px; }
  .card .ico {
    width: 30px; height: 30px; border-radius: 9px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; color: var(--accent);
  }
  .card .ico svg { width: 17px; height: 17px; }

  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  .btn {
    height: 38px; padding: 0 16px; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 600;
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: #eef1f6; color: var(--ink); }

  #hostCard .go { margin-top: auto; padding-top: 16px; }
  #hostCard .go .btn { width: 100%; }

  #linkCard.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field { margin-top: 14px; display: flex; gap: 8px; }
  /* 输入框和固定的「:6767」拼成一个整体，看起来就是「地址 + 端口」一格填完 */
  .inputwrap {
    flex: 1; min-width: 0; height: 38px; display: flex; align-items: center;
    border: 1px solid var(--line); border-radius: 10px; background: #fbfcfe;
    padding-right: 10px; transition: border-color .15s, background .15s;
  }
  .inputwrap:focus-within { border-color: var(--accent); background: #fff; }
  .inputwrap input {
    flex: 1; min-width: 0; height: 100%; padding: 0 0 0 12px;
    border: 0; background: none; outline: none;
    font: inherit; font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .inputwrap .port {
    font-size: 12px; color: var(--ink3); white-space: nowrap;
    font-variant-numeric: tabular-nums; user-select: none;
  }
  .inputwrap .port[hidden] { display: none; }
  /* 历史条目：本体点击 = 直接连，尾巴 × = 删掉这条记录 */
  .recent { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .recent[hidden] { display: none; }
  .chipwrap {
    display: inline-flex; align-items: stretch; border-radius: 7px;
    background: #eef1f6; overflow: hidden; font-variant-numeric: tabular-nums;
  }
  .chipwrap:hover { background: var(--accent-soft); }
  .chip {
    font-size: 12px; padding: 4px 9px; color: var(--ink2);
  }
  .chipwrap:hover .chip { color: var(--accent); }
  .chipwrap .del {
    font-size: 12px; color: var(--ink3); padding: 4px 7px 4px 2px; line-height: 1;
  }
  .chipwrap .del:hover { color: var(--err); }
  .recent .none { font-size: 12px; color: var(--ink3); }

  .opt { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; font-size: 12.5px; color: var(--ink2); }
  .opt input { margin: 3px 0 0; accent-color: var(--accent); }
  .opt b { color: var(--ink); font-weight: 600; }
  .opt i { display: block; font-style: normal; font-size: 11.5px; color: var(--ink3); margin-top: 2px; }

  .foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink2);
  }
  .foot label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .foot input { accent-color: var(--accent); margin: 0; }
  .dir {
    display: flex; align-items: center; gap: 6px; min-width: 0;
    color: var(--ink3); font-size: 12px;
  }
  .dir code {
    max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: #eef1f6; padding: 2px 6px; border-radius: 5px;
  }
  .dir button { color: var(--accent); font-size: 12px; }

  .err { margin-top: 12px; font-size: 12.5px; color: var(--err); min-height: 18px; }
  .err:empty { visibility: hidden; }

  .mem {
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px;
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
    font-size: 12px; color: var(--ink3);
  }
  .mem[hidden] { display: none; }
  .mem b { color: var(--ink2); font-weight: 600; }
  .mem button { color: var(--accent); font-size: 12px; }
  .mem button:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="drag"></div>

<div class="center">
  <!-- 启动动画 / 执行中 -->
  <div id="boot">
    <img class="mark" src="../public/icon.png" alt="XiaoMao 互传">
    <div class="brand">XiaoMao 互传</div>
    <div class="spin"></div>
    <div class="boot-tip" id="bootTip">正在启动…</div>
  </div>

  <!-- 选择页 -->
  <div id="pick" hidden>
    <div class="head">
      <img class="mark" src="../public/icon.png" alt="XiaoMao 互传">
      <div class="brand">XiaoMao 互传</div>
    </div>
    <h1>这次要做什么？</h1>
    <p class="sub">两者都能收发文件，区别只在于「谁开着服务等你连」。</p>

    <div class="cards">
      <div class="card" id="hostCard">
        <div class="t">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
          当我自己的主机
        </div>
        <p class="d">别人用局域网地址连这台电脑，把东西传给你。手机会出现在「待授权」里，由你放行。</p>
        <span class="note">进入后显示本机的局域网地址与二维码</span>
        <div class="go"><button class="btn" id="hostGo">进入我的主机</button></div>
      </div>

      <div class="card" id="linkCard">
        <div class="t">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.1 0l3-3a5 5 0 0 0-7.1-7.1L11 5"/><path d="M14 11a5 5 0 0 0-7.1 0l-3 3a5 5 0 0 0 7.1 7.1L13 19"/></svg></span>
          连接别人的主机
        </div>
        <p class="d">我当普通设备，用别人开着的服务。不需要对方做任何设置。</p>
        <div class="field">
          <div class="inputwrap">
            <input type="text" id="url" placeholder="192.168.1.20" spellcheck="false" autocomplete="off">
            <span class="port" id="portHint">:6767</span>
          </div>
          <button class="btn" id="linkGo">连接</button>
        </div>
        <div class="recent" id="recent"></div>
        <label class="opt">
          <input type="checkbox" id="keepHost">
          <span>同时开着这台的接收服务，<b>手机/电脑还能传给我</b>
            <i id="keepNote">不勾就纯当客户端；勾了只在后台占用 6767 端口，不会多开窗口</i>
          </span>
        </label>
      </div>
    </div>

    <div class="err" id="err"></div>

    <div class="foot">
      <label><input type="checkbox" id="remember"> 记住这次选择，以后不再问</label>
      <div class="dir">
        数据目录 <code id="dir">…</code>
        <button id="dirBtn">更改</button>
      </div>
    </div>

    <!-- 记住过的话，这里显示记的是什么，并给一条反悔的路 -->
    <div class="mem" id="mem" hidden>
      <span>已记住：<b id="memWhat"></b></span>
      <button id="memReset">改回每次询问</button>
    </div>
  </div>
</div>

<script>
(function () {
  var api = window.xmDesktop || null;
  var boot = document.getElementById('boot');
  var bootTip = document.getElementById('bootTip');
  var pick = document.getElementById('pick');
  var errBox = document.getElementById('err');
  var urlInp = document.getElementById('url');
  var portHint = document.getElementById('portHint');
  var keepHost = document.getElementById('keepHost');
  var remember = document.getElementById('remember');
  var recentBox = document.getElementById('recent');
  var linkCard = document.getElementById('linkCard');
  var linkGo = document.getElementById('linkGo');
  var hostGo = document.getElementById('hostGo');
  var mem = document.getElementById('mem');
  var memWhat = document.getElementById('memWhat');
  var memReset = document.getElementById('memReset');
  var busy = false;
  var curState = null;   // 最近一次 render 的状态，删历史条目后局部重画用

  if (api && api.platform) document.documentElement.dataset.platform = api.platform;

  function showBoot(tip) { bootTip.textContent = tip || '正在启动…'; boot.hidden = false; pick.hidden = true; }
  function showPick() { boot.hidden = true; pick.hidden = false; }

  function fail(msg) {
    busy = false;
    hostGo.disabled = false;
    linkGo.disabled = false;
    showPick();
    errBox.textContent = msg || '';
    bootTip.textContent = '正在启动…';
  }

  function choose(payload) {
    if (busy) return;
    busy = true;
    errBox.textContent = '';
    hostGo.disabled = true;
    linkGo.disabled = true;
    showBoot(payload.action === 'link' ? '正在连接…' : '正在启动服务…');
    api.startChoose(payload).catch(function () { fail('启动失败了，再试一次'); });
  }

  function pickHost() {
    choose({ action: 'host', remember: remember.checked });
  }

  function pickLink() {
    var raw = (urlInp.value || '').trim();
    if (!raw) {
      errBox.textContent = '先填对方的地址，例如 192.168.1.20';
      urlInp.focus();
      return;
    }
    if (incompleteHost(raw)) {
      errBox.textContent = 'IP 还没写完，比如 192.168.1.20（端口不用填，默认 ' + DEFAULT_PORT + '）';
      urlInp.focus();
      urlInp.setSelectionRange(raw.length, raw.length);
      return;
    }
    choose({ action: 'link', url: raw, keepHost: keepHost.checked, remember: remember.checked });
  }

  /* ---------- 地址输入 ---------- */

  var DEFAULT_PORT = '6767';
  var PREFIX = '192.168.';   // 家用/办公局域网最常见的开头，先垫上，少敲四位

  /**
   * 主机名只写了半截（比如还停在 "192.168."）就别发请求了 ——
   * 主进程那边只会回一句"这个地址看不懂"，不如在这里直接说清楚还差什么。
   * 域名、带协议的地址一律放行，交给主进程判断。
   */
  function incompleteHost(raw) {
    var hostPart = raw.replace(/^https?:\/\//i, '').split('/')[0].split(':')[0];
    if (!/^[\d.]+$/.test(hostPart)) return false;
    return hostPart.split('.').filter(Boolean).length < 4;
  }

  /** 用户自己写了端口（192.168.1.20:8080）时，把固定的 :6767 让开，别误导 */
  function syncPortHint() {
    var v = (urlInp.value || '').replace(/^https?:\/\//i, '');
    portHint.hidden = /:[0-9]{2,5}(\/|$)/.test(v);
  }

  /* ---------- 渲染 ---------- */

  /** 记住过就把「记住的是什么」写出来 —— 只记不说话，用户不知道怎么取消 */
  function paintMem(st) {
    if (!st || st.mode === 'ask') { mem.hidden = true; return; }
    memWhat.textContent = st.mode === 'link'
      ? '启动时直接连 ' + String(st.lastLinkUrl || '上次那台').replace(/^https?:\/\//, '').replace(/\/+$/, '')
      : '启动时直接进入我的主机';
    mem.hidden = false;
  }

  /** 历史条目：点地址直接连（勾着「记住」就连带记住），点 × 只删记录 */
  function chipWrap(url) {
    var w = document.createElement('span');
    w.className = 'chipwrap';
    var b = document.createElement('button');
    b.className = 'chip';
    b.textContent = String(url).replace(/^https?:\/\//, '').replace(/\/+$/, '');
    b.title = '点击直接连接这台主机';
    b.onclick = function () {
      choose({ action: 'link', url: url, keepHost: keepHost.checked, remember: remember.checked });
    };
    var del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.title = '删除这条记录（不影响已开的连接）';
    del.onclick = function (ev) {
      ev.stopPropagation();
      if (!api.forgetLink) return;
      api.forgetLink(url).then(function (r) {
        var next = Object.assign({}, curState || {}, { recent: (r && r.recent) || [] });
        render(next);
      }).catch(function () { /* 删不掉就留着，别为一条记录报错 */ });
    };
    w.appendChild(b);
    w.appendChild(del);
    return w;
  }

  function render(st) {
    curState = st;
    if (st.dataDir) document.getElementById('dir').textContent = st.dataDir;
    keepHost.checked = st.keepHost === true;
    if (st.defaultPort) {
      DEFAULT_PORT = String(st.defaultPort);
      portHint.textContent = ':' + DEFAULT_PORT;
      document.getElementById('keepNote').textContent =
        '不勾就纯当客户端；勾了只在后台占用 ' + DEFAULT_PORT + ' 端口，不会多开窗口';
    }

    var list = (st.recent || []).filter(function (u) { return u && u !== st.lastLinkUrl; });
    recentBox.textContent = '';
    if (st.lastLinkUrl) {
      urlInp.value = String(st.lastLinkUrl).replace(/^https?:\/\//, '').replace(/\/+$/, '');
    } else {
      urlInp.value = PREFIX;   // 没连过就垫上 192.168.，用户补完后两段即可
    }
    list.slice(0, 5).forEach(function (u) { recentBox.appendChild(chipWrap(u)); });
    // 上次那台已经在输入框里了，不重复列；一条别的都没有就整行收起来，别留空行
    if (!recentBox.children.length) {
      if (st.lastLinkUrl) {
        recentBox.hidden = true;
      } else {
        var n = document.createElement('span');
        n.className = 'none';
        n.textContent = '连过一次之后，地址会记在这里';
        recentBox.appendChild(n);
      }
    }
    syncPortHint();
    showPick();
    // 地址已经在框里（记忆或前缀），光标落到末尾，接着敲就行
    if (urlInp.value && !st.lastLinkUrl) {
      urlInp.focus();
      urlInp.setSelectionRange(urlInp.value.length, urlInp.value.length);
    } else {
      (urlInp.value ? linkGo : hostGo).focus();
    }
  }

  /* ---------- 事件 ---------- */

  // 只有按钮能进 —— 卡片本身不做点击热区。整块可点会让人误触：
  // 想凑近读一下说明，或者想拖窗口，结果直接跳走了
  hostGo.onclick = pickHost;
  linkGo.onclick = pickLink;

  linkCard.addEventListener('focusin', function () { linkCard.classList.add('on'); });
  linkCard.addEventListener('focusout', function () { linkCard.classList.remove('on'); });

  urlInp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); pickLink(); }
  });
  urlInp.addEventListener('input', syncPortHint);

  // 从聊天里复制来的完整地址（192.168.1.20 或 http://…）整段替换，
  // 不然会接在预填的 "192.168." 后面变成一串废地址；粘半截则照常插在光标处
  urlInp.addEventListener('paste', function (e) {
    var t = ((e.clipboardData || window.clipboardData).getData('text') || '').trim();
    if (!/^(https?:\/\/)?([\w-]+\.){2,}[\w-]+/i.test(t)) return;
    e.preventDefault();
    urlInp.value = t.replace(/^https?:\/\//i, '').replace(/\/+$/, '');
    syncPortHint();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !pick.hidden) errBox.textContent = '';
  });

  document.getElementById('dirBtn').onclick = function () { api.startDataDir(); };

  memReset.onclick = function () {
    if (!api.startForget) return;
    api.startForget().then(function () {
      mem.hidden = true;
      remember.checked = false;
      errBox.textContent = '';
    }).catch(function () {
      errBox.textContent = '没能改回来，稍后再试一次';
    });
  };

  if (!api || !api.startChoose) {
    bootTip.textContent = '这个页面要在桌面端打开';
    return;
  }

  // 主进程发现服务起不来、或地址不合法时会走这里：退回选择页并说明原因
  api.onStartError(fail);

  // 主进程在导航时随 URL 带回来的启动错误（比如记住了「直接连」但那台已经不在了），
  // 比消息通道稳 —— 不用赌页面监听器挂好没有
  var qs = {};
  try { new URL(location.href).searchParams.forEach(function (v, k) { qs[k] = v; }); } catch (e) { /* 解析不了就当没带 */ }
  if (qs.startErr) fail(decodeURIComponent(qs.startErr));

  // 菜单「连接其他主机…」：把焦点引到右边那张卡
  api.onStartAskLink(function () {
    if (pick.hidden) return;
    linkCard.classList.add('on');
    urlInp.focus();
    urlInp.select();
  });

  api.startState().then(function (st) {
    st = st || {};
    paintMem(st);
    // force：菜单里主动点了「现在重新选一次」，不管记没记住都问一次
    if (st.force || st.mode === 'ask') return render(st);
    // 记住了就直接按记忆走，这里保持启动动画，主进程会接管跳转
    showBoot(st.mode === 'link' ? '正在连接…' : '正在启动服务…');
    // 兜底：正常情况下主进程马上会把页面接走；万一哪条路径漏了接管，
    // 6 秒后退回选择页自救，别让人对着一屏转圈干等
    setTimeout(function () {
      if (boot.hidden) return;
      api.startState().then(function (s2) { render(s2 || {}); }).catch(function () { /* 已接管就算了 */ });
    }, 6000);
  }).catch(function () {
    bootTip.textContent = '读不到启动设置';
  });
})();
</script>
</body>
</html>
